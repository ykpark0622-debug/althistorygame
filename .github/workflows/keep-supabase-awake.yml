name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the gallery once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then echo "SUPABASE_URL / SUPABASE_KEY secrets are not set"; exit 1; fi
          curl -fsS "$SUPABASE_URL/rest/v1/scenarios?select=id&limit=1" -H "apikey: $SUPABASE_KEY" -o /dev/null
          echo "ok"
