<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>역사 지도 10선 · 역사의 갈림길</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="map-view.css">
<style>body{margin:0;background:#f0efe7;color:#263d34}.atlas{max-width:1600px;margin:auto;padding:28px}.atlas header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:22px}.atlas h1{font-size:32px;margin:5px 0}.atlas p{line-height:1.75}.atlas-grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}.atlas-nav{display:flex;flex-direction:column;gap:8px}.atlas-nav button{text-align:left;padding:14px;border:1px solid #d5decc;background:#fffdf7;color:#2c4439;border-radius:9px;cursor:pointer;font:inherit}.atlas-nav button[aria-pressed=true]{background:#234c3f;color:#fff}.atlas-nav small{display:block;margin-top:5px;opacity:.8}.atlas-content{min-width:0}.atlas .history-map{margin:0}.atlas .map-viewport{height:auto}.atlas .province-map{height:64vh;min-height:360px;max-height:760px;aspect-ratio:auto}.atlas-meta{padding:20px;background:#fffdf7;border:1px solid #d5decc;border-radius:10px;margin-top:15px}.atlas-meta h2{margin:0 0 8px}.atlas-meta a{color:#315a83}.atlas-error{color:#9c4036}.atlas-description{white-space:pre-wrap;font-size:13px}.atlas-help{font-size:13px;color:#667368}.atlas .btn{white-space:nowrap}@media(max-width:800px){.atlas{padding:15px}.atlas-grid{grid-template-columns:1fr}.atlas-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.atlas-nav button{font-size:12px;padding:11px}.atlas .province-map{height:55vh;min-height:300px}.atlas h1{font-size:25px}}
</style></head><body><main class="atlas"><header><div><span class="small-label">CHRONICLES OF CHOICE · HISTORICAL ATLAS</span><h1>역사 지도 10선</h1><p class="atlas-help">기준 시점을 고른 뒤 지도를 살펴보고, 지도 JSON을 받아 작업실이나 갤러리에서 사용하세요.</p></div><a class="btn secondary" href="index.html?home=1">초기 화면으로</a></header><div class="atlas-grid"><nav class="atlas-nav" id="atlas-nav" aria-label="역사 지도 선택"></nav><section class="atlas-content"><p id="atlas-status" role="status">지도 목록을 준비합니다.</p><div id="atlas-map"></div><section class="atlas-meta"><h2 id="atlas-title">지도 선택</h2><p id="atlas-date"></p><p id="atlas-count"></p><a id="atlas-download" class="btn primary" hidden>지도 JSON 받기</a><p class="atlas-help">지도를 클릭한 뒤 WASD·Shift로 이동하고 휠로 확대·축소합니다. 지도 제작기에서 JSON을 가져오면 국가·색상·영토·국명 위치를 편집할 수 있습니다. 갤러리에는 받은 JSON을 직접 올립니다.</p><details><summary>기준·해석·출처와 한계</summary><p id="atlas-description" class="atlas-description"></p></details></section></section></div></main>
<script src="map-templates.js"></script><script src="map-view.js"></script><script src="engine.js"></script><script src="map-document.js"></script>
<script>(function(){'use strict';const byId=id=>document.getElementById(id);let sequence=0;async function open(item){const request=++sequence;byId('atlas-status').textContent='선택한 지도를 불러옵니다…';byId('atlas-status').className='';try{const response=await fetch(item.path);if(!response.ok)throw Error('지도 JSON을 찾을 수 없습니다.');const doc=await response.json();await MapTemplates.ensure(doc.map.templateId);if(request!==sequence)return;const check=MapDocument.validate(doc);if(check.errors.length)throw Error(check.errors.join('\n'));MapView.dispose(byId('atlas-map'));MapView.render(byId('atlas-map'),MapDocument.toScenario(doc),null);byId('atlas-title').textContent=doc.title;byId('atlas-date').textContent=item.date;byId('atlas-count').textContent=item.regions.toLocaleString()+'개 구획 · '+item.countries+'개 국가/편집 단위';byId('atlas-description').textContent=doc.description;const link=byId('atlas-download');link.href=item.path;link.download=item.path.split('/').pop();link.hidden=false;for(const button of byId('atlas-nav').children)button.setAttribute('aria-pressed',String(button.dataset.mapId===item.id));byId('atlas-status').textContent='';history.replaceState(null,'','#'+item.id);}catch(error){if(request!==sequence)return;byId('atlas-status').className='atlas-error';byId('atlas-status').textContent=error.message;}}fetch('examples/gallery-atlas/index.json').then(r=>{if(!r.ok)throw Error('지도 목록을 찾을 수 없습니다.');return r.json();}).then(items=>{for(const item of items){const button=document.createElement('button');button.type='button';button.dataset.mapId=item.id;button.setAttribute('aria-pressed','false');const title=document.createElement('strong');title.textContent=item.title;const date=document.createElement('small');date.textContent=item.date;button.append(title,date);button.onclick=()=>open(item);byId('atlas-nav').append(button);}const requested=location.hash.slice(1);if(items.length)open(items.find(item=>item.id===requested)||items[0]);}).catch(error=>{byId('atlas-status').className='atlas-error';byId('atlas-status').textContent=error.message;});})();</script></body></html>
