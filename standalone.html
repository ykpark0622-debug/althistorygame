        } else if (condition.kind === 'territory' && v2(scenario)) {
          if (!mapConfig || !provinceIds.has(condition.key)) error(`${place}: 지도 지역을 찾을 수 없습니다.`);
          if (!mapLayer(condition.field)) error(`${place}: 영토 조건의 field가 올바르지 않습니다.`);
          if (!['eq', 'ne'].includes(condition.op)) error(`${place}: 영토 비교에는 eq 또는 ne를 사용해 주세요.`);
          if (condition.field === 'marker') { if (condition.value !== null) textField(condition.value, place + ' 표식', false, 300); }
          else if (condition.value !== null && !countryIds.has(condition.value)) error(`${place}: 지도 국가를 찾을 수 없습니다.`);
        } else error(`${place}: 조건 종류는 stat 또는 flag${v2(scenario) ? ', territory' : ''}여야 합니다.`);
      });
    }
    function next(value, label) {
      if (value !== 'END' && value !== 'RETURN' && !eventIds.has(value)) error(`${label}: 다음 사건 '${show(value)}'을 찾을 수 없습니다.`);
    }

    events.forEach((event, eventIndex) => {
      if (!plain(event)) return;
      const label = `사건 ${itemName(event, eventIndex)}`;
      textField(event.title, `${label} 제목`, true, 300);
      textField(event.body, `${label} 본문`, true);
      ['chapter', 'date', 'speaker'].forEach(field => textField(event[field], `${label} ${field}`, false, 300));
      conditions(event.when, `${label} 등장 조건`);
      next(event.next, `${label} 기본 경로`);
      const choices = collection(event.choices, `${label} 선택지`, 1, 20);
      choices.forEach((choice, index) => {
        const place = `${label} 선택지 ${index + 1}`;
        if (!plain(choice)) { error(`${place}: 객체가 필요합니다.`); return; }
        textField(choice.text, `${place} 내용`, true, 1000);
        textField(choice.description, `${place} 설명`, false, 2000);
        conditions(choice.when, `${place} 조건`);
        if (choice.next !== undefined) next(choice.next, place);
        if (v2(scenario)) {
          territory(choice.territory, place);
          textField(choice.result, place + ' 결과');
          if (own(choice, 'historical') && typeof choice.historical !== 'boolean') error(place + ': historical은 true 또는 false여야 합니다.');
        }
        if (choice.effects !== undefined && !plain(choice.effects)) error(`${place}: effects는 능력치 변화 객체여야 합니다.`);
        else for (const [key, value] of Object.entries(choice.effects || {})) {
          if (!statIds.has(key)) error(`${place}: 능력치 '${key}'가 없습니다.`);
          if (!finite(value)) error(`${place}: 능력치 변화는 유한한 숫자여야 합니다.`);
        }
        if (choice.setFlags !== undefined && !plain(choice.setFlags)) error(`${place}: setFlags는 기록 변경 객체여야 합니다.`);
        else for (const [key, value] of Object.entries(choice.setFlags || {})) {
          if (!flagIds.has(key)) error(`${place}: 기록 '${key}'이 없습니다.`);
          if (typeof value !== 'boolean') error(`${place}: 기록 변경값은 true 또는 false여야 합니다.`);
        }
      });
      if (choices.length && !choices.some(choice => plain(choice) && (!choice.when || choice.when.length === 0))) warnings.push(`${label}: 조건 없는 선택지가 없습니다. 특정 상황에서 모든 선택지가 잠길 수 있습니다.`);
    });

    endings.forEach((ending, index) => {
      if (!plain(ending)) return;
      const label = `엔딩 ${itemName(ending, index)}`;
      textField(ending.title, `${label} 제목`, true, 300);
      textField(ending.summary, `${label} 요약`, false, 2000);
      textField(ending.body, `${label} 본문`, true);
      if (!['good', 'mixed', 'bad'].includes(ending.kind)) error(`${label}: 종류는 good, mixed, bad 중 하나여야 합니다.`);
      if (!finite(ending.priority)) error(`${label}: priority는 유한한 숫자여야 합니다.`);
      if (typeof ending.immediate !== 'boolean') error(`${label}: immediate는 true 또는 false여야 합니다.`);
      if (own(ending, 'chance')) {
        if (!finite(ending.chance) || ending.chance < 0 || ending.chance > 100) error(`${label}: chance는 0~100 사이의 유한한 숫자여야 합니다.`);
        if (ending.immediate !== true) error(`${label}: 확률은 즉시 엔딩(immediate: true)에만 설정할 수 있습니다.`);
      }
      conditions(ending.when, `${label} 조건`);
    });
    randomEvents.forEach((rule, index) => {
      if (!plain(rule)) return;
      const label = `랜덤 사건 규칙 ${itemName(rule, index)}`;
      textField(rule.title, `${label} 제목`, true, 300);
      if (!eventIds.has(rule.eventId)) error(`${label}: 대응 사건 '${show(rule.eventId)}'을 찾을 수 없습니다.`);
      conditions(rule.when, `${label} 조건`);
      if (!finite(rule.chance) || rule.chance < 0 || rule.chance > 100) error(`${label}: chance는 0~100 사이의 유한한 숫자여야 합니다.`);
      if (!finite(rule.priority)) error(`${label}: priority는 유한한 숫자여야 합니다.`);
      if (own(rule, 'once') && typeof rule.once !== 'boolean') error(`${label}: once는 true 또는 false여야 합니다.`);
      if (own(rule, 'cooldown') && (!Number.isSafeInteger(rule.cooldown) || rule.cooldown < 0)) error(`${label}: cooldown은 0 이상의 안전한 정수여야 합니다.`);
    });
    if (reignMode(scenario)) {
      if (!plain(scenario.reign)) { if (!draft) error('치세 모드에는 reign 설정이 필요합니다.'); }
      else {
        const parts = collection(scenario.reign.parts, '치세 부문', draft ? 0 : 1, 20);
        const turns = collection(scenario.reign.turns, '치세 턴', draft ? 0 : 1, 1000);
        const partIds = ids(parts, '치세 부문'); ids(turns, '치세 턴');
        parts.forEach(part => { if (!plain(part)) return; textField(part.name, '부문 이름', true, 100); if (part.color !== undefined && !/^#[0-9a-f]{6}$/i.test(part.color)) error('부문 색상은 #RRGGBB 형식이어야 합니다.'); });
        for (const turn of turns) {
          if (!plain(turn)) continue;
          textField(turn.title, '치세 턴 제목', true, 300); textField(turn.body, '치세 턴 본문'); textField(turn.date, '치세 턴 날짜', false, 300);
          if (!Array.isArray(turn.eventIds) || turn.eventIds.length > 1000) error('치세 턴 eventIds는 1,000개 이하 배열이어야 합니다.');
          else for (const id of turn.eventIds) { const event = events.find(item => item && item.id === id); if (!event || !partIds.has(event.part)) error('치세 턴의 사건 또는 부문을 찾을 수 없습니다: ' + show(id)); }
          for (const name of ['between', 'settlements']) {
            if (turn[name] === undefined) continue;
            const rules = collection(turn[name], '치세 규칙', 0, 1000); ids(rules, '치세 규칙');
            for (const rule of rules) {
              if (!plain(rule)) continue;
              textField(rule.text, '치세 규칙 결과', true); conditions(rule.when, '치세 규칙 조건'); territory(rule.territory, '치세 규칙');
              if (rule.effects !== undefined && !plain(rule.effects)) error('치세 규칙 effects는 객체여야 합니다.');
              else for (const [id, delta] of Object.entries(rule.effects || {})) if (!statIds.has(id) || !finite(delta)) error('치세 규칙의 수치 변화가 올바르지 않습니다: ' + id);
              if (rule.setFlags !== undefined && !plain(rule.setFlags)) error('치세 규칙 setFlags는 객체여야 합니다.');
              else for (const [id, value] of Object.entries(rule.setFlags || {})) if (!flagIds.has(id) || typeof value !== 'boolean') error('치세 규칙의 선택 기록이 올바르지 않습니다: ' + id);
            }
          }
        }
      }
    }
    const fallback = endings.find(ending => plain(ending) && ending.id === scenario.defaultEnding);
    if (fallback && (fallback.immediate !== false || (fallback.when && fallback.when.length !== 0))) error('기본 엔딩은 immediate: false이고 조건이 없는 엔딩이어야 합니다.');
    return { errors, warnings };
  }

  function testConditions(conditions, state) {
    if (conditions === undefined) return true;
    if (!Array.isArray(conditions) || !state) return false;
    return conditions.every(condition => {
      if (!plain(condition) || !operators.has(condition.op)) return false;
      if (condition.kind === 'territory') {
        const layer = mapLayer(condition.field);
        if (!state.map || !layer || !['eq', 'ne'].includes(condition.op)) return false;
        const actual = own(state.map[layer], condition.key) ? state.map[layer][condition.key] : null;
        return condition.op === 'eq' ? actual === condition.value : actual !== condition.value;
      }
      const group = condition.kind === 'stat' ? state.stats : condition.kind === 'flag' ? state.flags : null;
      if (!group || !own(group, condition.key)) return false;
      const actual = group[condition.key];
      if (typeof actual !== typeof condition.value) return false;
      switch (condition.op) {
        case 'eq': return actual === condition.value;
        case 'ne': return actual !== condition.value;
        case 'gte': return actual >= condition.value;
        case 'lte': return actual <= condition.value;
        case 'gt': return actual > condition.value;
        case 'lt': return actual < condition.value;
        default: return false;
      }
    });
  }

  function explainCondition(condition, scenario) {
    if (!condition) return '조건 정보가 없습니다.';
    if (condition.kind === 'territory') {
      let province = condition.key;
      try { province = getMapConfig(scenario)?.provinces.find(item => item.id === condition.key)?.name || province; } catch (_) {}
      return `${province} ${condition.field || 'owner'} ${condition.op === 'ne' ? '≠' : '='} ${condition.value === null ? '없음' : condition.value}`;
    }
    if (condition.kind === 'flag') {
      const flag = scenario.flags.find(item => item.id === condition.key);
      const expected = condition.op === 'ne' ? !condition.value : condition.value;
      return `${flag ? flag.name : condition.key}: ${expected ? '있음' : '없음'}`;
    }
    const stat = scenario.stats.find(item => item.id === condition.key);
    const labels = { eq: '일 때', ne: '아닐 때', gte: '이상', lte: '이하', gt: '초과', lt: '미만' };
    return `${stat ? stat.name : condition.key} ${condition.value} ${labels[condition.op] || ''}`.trim();
  }

  function getEvent(scenario, state) {
    if (!state || state.endingId || !state.eventId) return null;
    return scenario.events.find(event => event.id === state.eventId) || null;
  }

  function getChoices(scenario, state, eventId) {
    const event = eventId === undefined ? getEvent(scenario, state) : scenario.events.find(item => item.id === eventId);
    if (!event) return [];
    return event.choices.map((choice, index) => {
      const failed = (choice.when || []).filter(condition => !testConditions([condition], state));
      return { choice, index, enabled: failed.length === 0, reason: failed.map(condition => explainCondition(condition, scenario)).join(' · ') };
    });
  }

  function matchingEndings(scenario, state, immediate) {
    return scenario.endings
      .filter(ending => ending.id !== scenario.defaultEnding && ending.immediate === immediate && testConditions(ending.when, state))
      .sort((a, b) => b.priority - a.priority);
  }

  function getImmediateRisks(scenario, state) {
    if (!state || state.endingId) return [];
    return matchingEndings(scenario, state, true).filter(ending => finite(ending.chance) && ending.chance > 0 && ending.chance < 100);
  }

  function tryImmediateEndings(scenario, state, riskRolls) {
    for (const ending of matchingEndings(scenario, state, true)) {
      const chance = ending.chance === undefined ? 100 : ending.chance;
      const roll = chance > 0 && chance < 100 ? rollPercent(state) : null;
      const triggered = chance === 100 || (chance > 0 && roll < chance);
      riskRolls.push({ endingId: ending.id, chance, roll, triggered });
      if (triggered) return ending;
    }
    return null;
  }

  function getRandomEventRisks(scenario, state) {
    if (!state || state.endingId || state.activeRandomEventId) return [];
    return (scenario.randomEvents || []).filter(rule => {
      const target = scenario.events.find(event => event.id === rule.eventId);
      const count = (state.randomEventCounts || {})[rule.id] || 0;
      const last = (state.lastTriggerTurns || {})[rule.id];
      return target && testConditions(rule.when, state) && testConditions(target.when, state)
        && (rule.once === false || count === 0)
        && (last === undefined || last === null || state.turn - last > (rule.cooldown || 0));
    }).sort((a, b) => b.priority - a.priority);
  }

  function tryRandomEvents(scenario, state, eventRolls) {
    for (const rule of getRandomEventRisks(scenario, state)) {
      const chance = rule.chance;
      const roll = chance > 0 && chance < 100 ? rollPercent(state) : null;
      const triggered = chance === 100 || (chance > 0 && roll < chance);
      eventRolls.push({ randomEventId: rule.id, chance, roll, triggered });
      if (triggered) return rule;
    }
    return null;
  }

  function clearInterruption(state) {
    state.pendingNext = null;
    state.activeRandomEventId = null;
  }

  function finish(scenario, state, immediateEnding) {
    const ending = immediateEnding || matchingEndings(scenario, state, false)[0] || scenario.endings.find(item => item.id === scenario.defaultEnding);
    if (!ending) throw new Error('선택할 수 있는 엔딩이 없습니다. 기본 엔딩을 확인해 주세요.');
    state.endingId = ending.id;
    state.eventId = null;
    clearInterruption(state);
    return state;
  }

  function resolve(scenario, state, destination) {
    const skipped = new Set();
    while (true) {
      if (destination === 'RETURN') {
        // A response can also be tested directly as a start event. Without an
        // interrupted path to resume, RETURN closes that standalone playthrough.
        destination = state.pendingNext || 'END';
        clearInterruption(state);
      }
      if (destination === 'REIGN' && reignMode(scenario)) { state.eventId = null; return state; }
      if (destination === 'END') return finish(scenario, state);
      if (skipped.has(destination)) throw new Error(`사건 '${destination}'의 등장 조건을 건너뛰는 경로가 순환합니다. 다음 사건을 수정해 주세요.`);
      skipped.add(destination);
      const event = scenario.events.find(item => item.id === destination);
      if (!event) throw new Error(`다음 사건 '${destination}'을 찾을 수 없습니다.`);
      if (!testConditions(event.when, state)) { destination = event.next; continue; }
      state.eventId = event.id;
      if (!getChoices(scenario, state).some(item => item.enabled)) throw new Error(`'${event.title}'에서 선택 가능한 선택지가 없습니다. 조건 없는 선택지를 추가해 주세요.`);
      return state;
    }
  }

  function createState(scenario, options = {}) {
    const result = validateScenario(scenario);
    if (result.errors.length) throw new Error(`시나리오를 확인해 주세요.\n${result.errors.join('\n')}`);
    if (!plain(options) || (own(options, 'seed') && !uint32(options.seed))) throw new Error('seed는 0~4,294,967,295 사이의 정수여야 합니다.');
    const seed = own(options, 'seed') ? options.seed : freshSeed();
    const playerName = normalizePlayerName(options.playerName === undefined ? scenario.player && scenario.player.defaultName : options.playerName);
    const state = { eventId: null, stats: {}, flags: {}, history: [], endingId: null, turn: 0, seed, rngState: seed,
      pendingNext: null, activeRandomEventId: null, randomEventCounts: {}, lastTriggerTurns: {}, playerName };
    scenario.stats.forEach(stat => { state.stats[stat.id] = stat.initial; });
    scenario.flags.forEach(flag => { state.flags[flag.id] = flag.initial; });
    (scenario.randomEvents || []).forEach(rule => { state.randomEventCounts[rule.id] = 0; state.lastTriggerTurns[rule.id] = null; });
    if (v2(scenario) && scenario.map) state.map = createMapState(scenario);
    if (reignMode(scenario)) {
      state.reign = { turnIndex: 0, decisions: {}, results: [], between: [] };
      return enterReignTurn(scenario, state, 0);
    }
    return resolve(scenario, state, scenario.start);
  }

  function choose(scenario, state, index) { return chooseInternal(scenario, state, index, false); }
  function chooseInternal(scenario, state, index, ignoreRisks) {
    if (!state || state.endingId) throw new Error('이미 결말에 도달했습니다. 새 게임을 시작해 주세요.');
    if (reignMode(scenario) && !state.activeRandomEventId) throw new Error('치세 카드는 choosePart로 선택해 주세요.');
    const event = getEvent(scenario, state);
    if (!event) throw new Error('현재 사건을 찾을 수 없습니다.');
    if (!Number.isInteger(index) || index < 0 || index >= event.choices.length) throw new Error('선택지 번호가 올바르지 않습니다.');
    if (state.history.length >= MAX_HISTORY) throw new Error('선택 기록이 5,000개에 도달했습니다. 시나리오의 반복 경로를 확인해 주세요.');
    if (!uint32(state.seed) || !uint32(state.rngState)) throw new Error('확률 상태가 올바르지 않습니다. 저장을 다시 불러와 주세요.');
    if (!plain(state.randomEventCounts) || !plain(state.lastTriggerTurns)) throw new Error('랜덤 사건 상태가 올바르지 않습니다. 저장을 다시 불러와 주세요.');
    const choice = event.choices[index];
    if (!testConditions(choice.when, state)) throw new Error('이 선택지는 조건을 충족하지 못해 선택할 수 없습니다.');
    const next = clone(state);
    const effects = {};
    for (const [key, delta] of Object.entries(choice.effects || {})) {
      const stat = scenario.stats.find(item => item.id === key);
      if (!stat || !finite(delta)) throw new Error(`능력치 변화 '${key}'가 올바르지 않습니다.`);
      const value = Math.max(stat.min, Math.min(stat.max, next.stats[key] + delta));
      effects[key] = value - next.stats[key];
      next.stats[key] = value;
    }
    for (const [key, value] of Object.entries(choice.setFlags || {})) {
      if (!own(next.flags, key) || typeof value !== 'boolean') throw new Error(`기록 변경 '${key}'가 올바르지 않습니다.`);
      next.flags[key] = value;
    }
    if (v2(scenario)) applyTerritory(next, choice.territory);
    next.turn += 1;
    const riskRolls = [];
    const eventRolls = [];
    next.history.push({ eventId: event.id, eventTitle: event.title, choiceText: choice.text, choiceIndex: index, effects, setFlags: clone(choice.setFlags || {}), turn: next.turn, riskRolls, eventRolls });
    if (v2(scenario)) {
      Object.assign(next.history[next.history.length - 1], { result: choice.result || '', historical: choice.historical === true, territory: clone(choice.territory || []) });
      if (next.reign && state.activeRandomEventId) next.reign.results.push(choiceResult(next, event, index));
    }
    const ending = ignoreRisks ? null : tryImmediateEndings(scenario, next, riskRolls);
    if (ending) return finish(scenario, next, ending);
    const destination = choice.next === undefined ? event.next : choice.next;
    if (state.activeRandomEventId) {
      if (destination !== 'RETURN' && !reignMode(scenario)) clearInterruption(next);
      return resolve(scenario, next, destination);
    }
    if (destination === 'RETURN') return resolve(scenario, next, destination);
    const rule = ignoreRisks ? null : tryRandomEvents(scenario, next, eventRolls);
    if (rule) {
      next.pendingNext = destination === 'RETURN' ? 'END' : destination;
      next.activeRandomEventId = rule.id;
      next.randomEventCounts[rule.id] += 1;
      next.lastTriggerTurns[rule.id] = next.turn;
      return resolve(scenario, next, rule.eventId);
    }
    return resolve(scenario, next, destination);
  }

  function applyRuleEffects(scenario, state, source) {
    const effects = {};
    for (const [id, delta] of Object.entries(source.effects || {})) {
      const stat = scenario.stats.find(item => item.id === id);
      if (!stat || !finite(delta)) throw new Error('수치 변화가 올바르지 않습니다: ' + id);
      const value = Math.max(stat.min, Math.min(stat.max, state.stats[id] + delta));
      effects[id] = value - state.stats[id]; state.stats[id] = value;
    }
    for (const [id, value] of Object.entries(source.setFlags || {})) {
      if (!own(state.flags, id) || typeof value !== 'boolean') throw new Error('선택 기록 변경이 올바르지 않습니다: ' + id);
      state.flags[id] = value;
    }
    applyTerritory(state, source.territory);
    return effects;
  }

  function applyReignRules(scenario, state, rules, type) {
    const results = [];
    for (const rule of rules || []) if (testConditions(rule.when, state)) {
      const effects = applyRuleEffects(scenario, state, rule);
      results.push({ type, id: rule.id, text: rule.text, turnIndex: state.reign.turnIndex, effects, setFlags: clone(rule.setFlags || {}), territory: clone(rule.territory || []) });
    }
    return results;
  }

  function enterReignTurn(scenario, state, index) {
    // Entry rules are not history actions. As with V1 startup, risks wait for
    // the next choice/settlement and evaluate its final state; entry never rolls.
    state.eventId = null;
    state.reign.turnIndex = index; state.reign.decisions = {};
    state.reign.between = applyReignRules(scenario, state, scenario.reign.turns[index].between, 'between');
    return state;
  }

  function getReignStatus(scenario, state) {
    if (!reignMode(scenario) || !state || !state.reign) return null;
    const turnIndex = state.reign.turnIndex, turn = scenario.reign.turns[turnIndex];
    const cards = [];
    if (turn && !state.endingId) for (const part of scenario.reign.parts) {
      const decided = state.reign.decisions[part.id];
      const event = decided ? scenario.events.find(item => item.id === decided.eventId) : (turn.eventIds || []).map(id => scenario.events.find(item => item.id === id)).find(item => item && item.part === part.id && testConditions(item.when, state));

  function parseJSON(text) {
    let value;
    try { value = JSON.parse(text); }
    catch (error) { return { errors: ['JSON 문법 오류: ' + error.message], warnings: [], value: null }; }
    const report = validation(value);
    return { ...report, value };
  }

  function acceptJSON(redraw) {
    const result = parseJSON(current.jsonBuffer);
    if (result.errors.length) { showReport(result); return false; }
    current.draft = copy(result.value);
    current.jsonDirty = false;
    current.dirty = true;
    if (redraw) render();
    showReport(result, 'JSON 내용을 편집 초안에 반영했습니다. 게임에 넣으려면 “적용하고 새 게임”을 누르세요.');
    return true;
  }

  function renderJSON(content) {
    content.append($('h2', '', 'JSON 직접 편집'));
    content.append(notice('전체 시나리오를 한 번에 수정하거나 다른 편집기로 옮길 수 있습니다. “JSON을 편집 초안에 반영”을 누르면 문법과 연결을 검사합니다. JSON 내보내기는 현재 초안을 파일로 저장합니다.'));
    if (!current.jsonDirty) current.jsonBuffer = JSON.stringify(current.draft, null, 2);
    const wrap = $('label', 'field');
    wrap.append($('span', '', '전체 시나리오 JSON'));
    const area = $('textarea', 'json-editor');
    area.rows = 26;
    area.spellcheck = false;
    area.value = current.jsonBuffer;
    area.addEventListener('input', () => { current.jsonBuffer = area.value; current.jsonDirty = true; mark(); });
    wrap.append(area);
    content.append(wrap);
    const toolbar = $('div', 'toolbar');
    toolbar.append(button('JSON을 편집 초안에 반영', () => acceptJSON(true), 'primary'), button('JSON 편집 취소', () => {
      if (current.jsonDirty && !confirm('이 화면에서 수정한 JSON을 버리고 편집 초안으로 되돌릴까요?')) return;
      current.jsonDirty = false; render();
    }));
    content.append(toolbar);
  }

  function exportJSON() {
    let text;
    if (current.jsonDirty) {
      const result = parseJSON(current.jsonBuffer);
      if (result.errors.length) { showReport(result); return; }
      text = JSON.stringify(result.value, null, 2);
    } else {
      const result = validation(current.draft);
      if (result.errors.length) { showReport(result); return; }
      text = JSON.stringify(current.draft, null, 2);
    }
    const blob = new Blob([text + '\n'], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = $('a');
    anchor.href = url;
    const safeID = String(current.draft.id || 'scenario').replace(/[^a-zA-Z0-9_-]/g, '_');
    anchor.download = safeID + '.json';
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showReport({ errors: [], warnings: [] }, '현재 편집 초안을 JSON으로 내보냈습니다. 게임에도 적용하려면 “적용하고 새 게임”을 누르세요.');
  }

  function importJSON(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showReport({ errors: ['JSON 파일은 5MB 이하로 준비해 주세요.'], warnings: [] }); return; }
    const owner = current;
    const reader = new FileReader();
    reader.addEventListener('load', () => {
      if (current !== owner) return;
      const result = parseJSON(String(reader.result).replace(/^\uFEFF/, ''));
      if (result.errors.length) { showReport(result); return; }
      if (current.dirty && !confirm('가져온 파일로 현재 편집 초안을 교체할까요? 아직 내보내지 않은 수정은 사라집니다.')) return;
      current.draft = copy(result.value);
      current.jsonDirty = false;
      current.eventIndex = 0;
      current.endingIndex = 0;
      current.randomIndex = 0;
      mark(); render();
      showReport(result, '파일을 편집 초안으로 가져왔습니다. 게임에 넣으려면 “적용하고 새 게임”을 누르세요.');
    });
    reader.addEventListener('error', () => {
      if (current === owner) showReport({ errors: ['파일을 읽지 못했습니다. 다시 선택해 주세요.'], warnings: [] });
    });
    reader.readAsText(file, 'UTF-8');
  }

  function check() {
    if (current.jsonDirty) {
      const parsed = parseJSON(current.jsonBuffer);
      if (parsed.errors.length) { showReport(parsed); return; }
      showReport(playReport(parsed.value), '플레이 검사를 통과했습니다. JSON 내용은 아직 편집 초안에 반영하지 않았습니다.');
      return;
    }
    showReport(playReport(current.draft), '플레이 검사를 통과했습니다. “적용하고 새 게임”으로 실행할 수 있습니다.');
  }

  function apply() {
    if (current.jsonDirty && !acceptJSON(false)) return;
    const result = playReport(current.draft);
    if (result.errors.length) { showReport(result); return; }
    const owner = current;
    try {
      const playable = copy(owner.draft);
      delete playable.draft;
      owner.onApply(playable);
      owner.dirty = false;
      close(true);
    } catch (error) {
      showReport({ errors: ['시나리오 적용 중 오류가 발생했습니다: ' + error.message], warnings: [] });
    }
  }

  function saveDraft() {
    if (current.jsonDirty && !acceptJSON(false)) return;
    const saved = copy(current.draft);
    saved.draft = true;
    const result = validation(saved);
    if (result.errors.length) { showReport(result); return; }
    const owner = current;
    try {
      owner.onApply(saved);
      owner.dirty = false;
      close(true);
    } catch (error) {
      showReport({ errors: ['초안 저장 중 오류가 발생했습니다: ' + error.message], warnings: [] });
    }
  }

  function clearAll() {

    if (mode !== 'reign') return '[진행 방식]\n- mode:"chronicle": 기존 사건과 선택지의 next를 따라 분기한다.';
    return `[진행 방식: 연차 통치 모드]
- schemaVersion:2, mode:"reign". reign:{parts:[{id,name,color}],turns:[{id,date,title,body,eventIds:[],between:[],settlements:[]}]}를 작성한다.
- parts는 조정·군무·외교 등 결정 분야다. 일반 사건에 part:"분야 id"를 붙인다. 각 turn.eventIds에는 그 연차의 사건 id만 나열한다. 분야마다 현재 조건을 만족하는 첫 사건을 사용한다.
- 플레이어는 현재 열린 모든 분야에서 하나씩 결정한 뒤 연차를 결산한다. 해당 모드의 일반 선택지는 next로 다음 사건을 직접 선택하지 않는다. 연차와 분야를 설계해라.
- 매 연차에 when 없는 일반 사건을 적어도 하나 배치하고, 각 사건에도 조건 없는 선택지를 남겨라. 이전 결정으로 다음 분야와 다음 연차의 사건이 달라지게 하라.
- between은 연차 진입 때(첫 연차 포함), settlements는 결산 때 적용하는 규칙 배열이다. {id,text,when:[],effects:{},setFlags:{},territory:[]} 형식이며 만족한 규칙을 나열한 순서대로 모두 적용한다. 뒤 규칙은 앞 규칙의 변경을 본다.
- 지연 결과는 이전 선택의 setFlags를 다음 연차 between/settlements.when에서 확인하여 표현한다. result에는 선택 직후 보여줄 결과 문장을 적는다.
- 돌발 사건은 같은 events 배열에 두되 turn.eventIds에는 넣지 않고 next:"RETURN"으로 복귀시킨다. 마지막 연차 결산 후 일반 엔딩을 판정한다.
- historical:true는 실제 역사에서 이루어진 선택이라고 확인한 경우에만 표시한다. 편의상 첫 선택지를 모두 실제 역사로 지정하지 마라.`;
  }

  function gameInstructions(mode) {
    if (mode !== 'reign') return GAME;
    return GAME.split('\n').map(line => {
      if (line.startsWith('- 플레이어는 사건')) return '- 플레이어는 한 연차에 열린 분야별 사건을 읽고 각 분야에서 선택지 하나씩을 고른 뒤 결산한다. 수치는 min~max 범위로 잘리고 setFlags로 기록이 바뀐다.';
      if (line.startsWith('- 다음 사건:')) return '- 다음 진행은 reign.turns의 순서다. 일반 사건·선택지의 next로 연차를 건너뛰지 않는다.';
      if (line.startsWith('- 사건에 when')) return '- 일반 사건의 when은 해당 연차·분야에서 표시할 카드의 자격이다. 조건이 안 맞으면 같은 분야에서 다음으로 자격 있는 사건을 찾는다.';
      if (line.startsWith('- 일반 엔딩')) return '- 일반 엔딩(immediate:false)은 마지막 연차 결산 후 조건이 맞는 엔딩 중 priority가 가장 높은 것으로 고른다. 하나도 맞지 않으면 defaultEnding이다.';
      if (line.startsWith('- 즉시 엔딩')) return line + ' 연차 결산 뒤에도 즉시 엔딩을 검사한다.';
      return line;
    }).join('\n');
  }

  function buildExample(options = {}) {
    const selected = settings(options);
    const example = copy(EXAMPLE);
    if (selected.version === 2) { example.schemaVersion = 2; example.mode = selected.mode; }
    example.events.forEach(event => event.choices.forEach(choice => { choice.result = '결정의 효과가 반영되었습니다.'; }));
    if (selected.template) {
      const template = selected.template;
      const province = template.provinces[0];
      const country = template.countries.find(item => item.id === province?.owner) || template.countries[0];
      if (!province || !country) throw new Error('기본 지도에 지역과 국가가 필요합니다.');
      const other = template.countries.find(item => item.id !== country.id) || country;
      example.map = { templateId: template.id, playerCountry: country.id, countries: [], initial: { owners: {}, occupation: {}, influence: {}, markers: {} } };
      example.events[0].choices[0].territory = [{ prov: province.id, influence: country.id, marker: '구호품 도착' }];
      example.events[0].choices[1].territory = [{ prov: province.id, to: other.id, occupation: other.id }];
      example.events[1].choices[0].territory = [{ prov: province.id, occupation: null, marker: null }];
    }
    if (selected.mode === 'reign') {
      example.id = 'example_reign_city';
      example.events[0].part = 'council';
      example.events[1].part = 'council';
      example.events.push(
        { id: 'e_patrol', part: 'guard', title: '호송대 편성', body: '구호선의 항로를 순찰할 인력이 필요합니다.', next: 'END', choices: [
          { text: '호송대를 늘린다', effects: { food: -5, trust: 5 }, result: '구호선에 호위가 붙었습니다.' },
          { text: '연안의 자율 순찰을 지원한다', effects: { trust: -3, food: 3 }, result: '도시의 지출을 줄였습니다.' }
        ] },
        { id: 'e_audit', part: 'guard', title: '창고의 장부', body: '겨울 창고의 분배를 점검할 시기입니다.', next: 'END', choices: [
          { text: '장부를 공개하고 구휼한다', effects: { food: -5, trust: 8 }, result: '시민들이 분배 과정을 확인했습니다.' },
          { text: '예비 식량을 쌓는다', effects: { food: 5, trust: -5 }, result: '도시의 비축이 늘었습니다.' }
        ] }
      );
      example.reign = {
        parts: [{ id: 'council', name: '조정', color: '#3f6d4f' }, { id: 'guard', name: '경비', color: '#8a6d3b' }],
        turns: [
          { id: 'turn_autumn', date: '11월', title: '봉쇄의 시작', body: '조정과 경비의 결정을 각각 내립니다.', eventIds: ['e_blockade', 'e_patrol'],
            between: [{ id: 'entry_rations', text: '도시의 기본 배급에 식량을 썼습니다.', when: [], effects: { food: -3 } }],
            settlements: [{ id: 'autumn_accounts', text: '가을의 분배 장부를 정리했습니다.', when: [], effects: { trust: 2 } }] },
          { id: 'turn_winter', date: '1월', title: '겨울의 결산', body: '이전 선택의 결과가 돌아옵니다.', eventIds: ['e_winter', 'e_audit'],
            between: [{ id: 'smuggler_debt', text: '밀수업자들이 지난 약속의 대가를 청했습니다.', when: [{ kind: 'flag', key: 'smugglers', op: 'eq', value: true }], effects: { trust: -8, food: 5 } }],
            settlements: [{ id: 'winter_accounts', text: '마지막 겨울을 결산합니다.', when: [], effects: { food: -3 } }] }
        ]
      };
    }
    return example;
  }

  function buildPrompt(options = {}) {
    const idea = String(options.idea || '').trim();
    const size = SIZES[options.size] || SIZES.short;
    const endings = Number(options.endings) || 5;
    const base = options.baseScenario;
    const selected = settings(options);
    const featureRules = '[선택한 형식]\n- schemaVersion:' + selected.version + ', mode:"' + selected.mode + '". 이 선택을 기준으로 전체 원고를 작성해라.' +
      (selected.version === 2 ? '\n- 선택지 result에는 결정 직후의 결과 문장을 적을 수 있다. historical:true는 실제 역사에서 이루어진 선택으로 확인한 경우에만 표시한다. 첫 선택지를 일괄적으로 실제 역사라고 표시하지 마라.' : '') +
      '\n\n' + reignInstructions(selected.mode) + '\n\n' + mapInstructions(selected.template);
    const head = '너는 선택형 텍스트 게임 「역사의 갈림길」의 시나리오 작가다.';
    if (base) {
      return [
        head,
        '아래 [현재 시나리오] JSON을 [요청]에 맞게 고치거나 늘려라. 바뀌지 않은 부분까지 모두 포함한 전체 JSON 하나로만 답해라.',
        '',
        '[요청]',
        idea || '이야기를 더 풍성하게 다듬고, 사건과 엔딩을 조금 더 늘려 줘.',
        '',
        gameInstructions(selected.mode), '', RULES, '', featureRules, '', CRAFT, '',
        '[현재 시나리오]',
        JSON.stringify(base)
      ].join('\n');
    }
    return [
      head,
      '아래 [만들 이야기]로 시나리오를 쓰고, [JSON 형식 규칙]에 정확히 맞는 JSON 하나로만 답해라.',
      '',
      '[만들 이야기]',
      idea || '주제는 네가 골라라. 실제 역사의 한 갈림길에서 다른 선택을 했다면 어떻게 되었을지 그리는 대체역사 이야기.',
      '',
      '[분량]',
      `- 사건(events) ${size.events}개, 엔딩(endings) ${endings}개(그중 즉시 엔딩 1~3개), 수치(stats) 3~5개, 기록(flags) 2~6개.`,
      '- 사건 본문은 3~6문장, 엔딩 본문은 3~7문장으로 간결하게 써라. 답변이 길어져 중간에 끊기지 않도록 분량을 지켜라.',
      '- 모든 글은 한국어로 쓴다. id만 영문으로 쓴다.',
      '',
      gameInstructions(selected.mode), '', RULES, '', featureRules, '', CRAFT, '',
      '[형식 예시 — 구조만 참고하고 내용·id·수치는 새로 만들어라]',
      JSON.stringify(buildExample(options))
    ].join('\n');
  }

  function buildRepairPrompt(problem) {
    const lines = ['방금 준 시나리오 JSON을 「역사의 갈림길」에 불러왔더니 아래 문제가 있었다.'];
    if (problem.kind === 'truncated') {
      lines.push('', '[문제]', '- 답변이 중간에 끊겨 JSON이 완성되지 않았다.', '',
        '같은 이야기를 사건 본문과 엔딩 본문을 더 짧게 줄이고 필요하면 사건 수도 줄여서, 처음부터 끝까지 완성된 전체 JSON 하나로 다시 출력해라. 설명은 쓰지 말고 JSON만 출력해라.');
    } else if (problem.kind === 'parse') {
      lines.push('', '[문제]', `- JSON 문법 오류: ${problem.detail}`, '- 쉼표 누락·남는 쉼표, 따옴표(" 대신 “ ”), 닫히지 않은 괄호, 주석이나 말줄임(...)이 있는지 확인해라.', '',
        '문법을 고친 전체 JSON을 처음부터 끝까지 다시 출력해라. 설명은 쓰지 말고 JSON만 출력해라.');
    } else if (problem.kind === 'empty') {
      lines.push('', '[문제]', '- 답변에서 JSON 객체({ ... })를 찾지 못했다.', '',
        '설명 없이 시나리오 전체를 JSON 객체 하나로 출력해라.');
    } else {
      const errors = (problem.errors || []).slice(0, 40);
      lines.push('', '[문제]', ...errors.map(item => '- ' + item));
      if ((problem.errors || []).length > errors.length) lines.push(`- 그 밖에 ${problem.errors.length - errors.length}개`);
      lines.push('', '위 문제를 모두 고친 전체 JSON을 처음부터 끝까지 다시 출력해라. 고친 부분만이 아니라 전체를 출력하고, 설명은 쓰지 마라.');
    }
    lines.push('', '원래 원고가 schemaVersion:2이면 지도와 연차 통치 설정을 유지해라. 모드를 임의로 V1로 낮추거나 지역·국가 id를 바꾸지 마라.', '', RULES);
    return lines.join('\n');
  }

  class PasteError extends Error {
    constructor(kind, message, detail = '') { super(message); this.kind = kind; this.detail = detail; }
  }

  // Walks text outside JSON strings. Returns the end index of the balanced object, or -1.
  function balancedEnd(text, start) {
    let depth = 0, inString = false, escaped = false;
    for (let i = start; i < text.length; i += 1) {
      const c = text[i];
      if (inString) {
        if (escaped) escaped = false;
        else if (c === '\\') escaped = true;
        else if (c === '"') inString = false;
        continue;
      }
      if (c === '/' && text[i + 1] === '/') { while (i < text.length && text[i] !== '\n') i += 1; continue; }
      if (c === '/' && text[i + 1] === '*') { const close = text.indexOf('*/', i + 2); if (close < 0) return -1; i = close + 1; continue; }
      if (c === '"') inString = true;
      else if (c === '{' || c === '[') depth += 1;
      else if (c === '}' || c === ']') { depth -= 1; if (depth === 0) return i; }
    }
    return -1;
  }

  // Light, string-aware cleanup: comments and trailing commas only.
  function looseClean(text) {
    let out = '', inString = false, escaped = false;
    for (let i = 0; i < text.length; i += 1) {
      const c = text[i];
      if (inString) {
        out += c;
        if (escaped) escaped = false;
        else if (c === '\\') escaped = true;
        else if (c === '"') inString = false;
        continue;
      }
      if (c === '"') { inString = true; out += c; continue; }
      if (c === '/' && text[i + 1] === '/') { while (i < text.length && text[i] !== '\n') i += 1; out += '\n'; continue; }
      if (c === '/' && text[i + 1] === '*') { const end = text.indexOf('*/', i + 2); out += ' '; i = end < 0 ? text.length : end + 1; continue; }
      out += c;
    }
    let cleaned = ''; inString = false; escaped = false;
    for (let i = 0; i < out.length; i += 1) {
      const c = out[i];
      if (inString) {
        cleaned += c;
        if (escaped) escaped = false;
        else if (c === '\\') escaped = true;
        else if (c === '"') inString = false;
        continue;
      }
      if (c === '"') inString = true;
      if (c === ',') {
        let next = i + 1; while (next < out.length && /\s/.test(out[next])) next += 1;
        if (out[next] === '}' || out[next] === ']') continue;
      }
      cleaned += c;
    }
    return cleaned;
  }

  function locate(text, position) {
    const before = text.slice(0, position), line = before.split('\n').length, column = position - before.lastIndexOf('\n');
    const snippet = text.slice(Math.max(0, position - 30), position + 30).replace(/\s+/g, ' ').trim();
    return `${line}번째 줄 ${column}번째 글자 근처 “${snippet}”`;
  }

  function extract(raw) {
    if (typeof raw !== 'string' || !raw.trim()) throw new PasteError('empty', '붙여 넣은 내용이 없습니다. AI의 답변을 복사해 붙여 넣어 주세요.');
    // Drop markdown fence lines so a continued answer can be appended at the end.
    const text = raw.replace(/^﻿/, '').split(/\r?\n/).filter(line => !/^\s*```/.test(line)).join('\n');
    let fallback = null, parseError = null, truncated = false;
    const candidates = /\{(?=\s*(?:"|\}|\/))/g;
    let candidate;
    while ((candidate = candidates.exec(text))) {
      const start = candidate.index;
      const likelyScenario = /"(?:schemaVersion|events|scenario|stats|endings)"\s*:/.test(text.slice(start, start + 300));
      const end = balancedEnd(text, start);
      if (end < 0) { if (likelyScenario) truncated = true; continue; }
      const body = text.slice(start, end + 1);
      let value, cleaned = false;
      try { value = JSON.parse(body); }
      catch (first) {
        try { value = JSON.parse(looseClean(body)); cleaned = true; }
        catch {
          if (!parseError || likelyScenario) {
            const match = /position (\d+)/.exec(first.message);
            const detail = match ? locate(body, Number(match[1])) : '정확한 위치를 찾지 못했습니다';
            parseError = new PasteError('parse', `JSON 문법 오류가 있습니다. ${detail}`, detail);
          }
          continue;
        }
      }
      if (value && typeof value === 'object' && !Array.isArray(value) && value.schemaVersion === undefined && !Array.isArray(value.events)) {
        const inner = Object.values(value).filter(item => item && typeof item === 'object' && !Array.isArray(item) && Array.isArray(item.events));
        if (inner.length === 1) value = inner[0];
      }
      const result = { value, cleaned };
      if (value && typeof value === 'object' && Array.isArray(value.events)) return result;
      if (!fallback || (value && value.schemaVersion !== undefined && fallback.value?.schemaVersion === undefined)) fallback = result;
      candidates.lastIndex = end + 1;
    }
    if (truncated) throw new PasteError('truncated', 'AI 답변이 중간에 끊긴 것 같습니다. JSON의 끝(마지막 } )이 없습니다.');
    if (parseError) throw parseError;
    if (fallback) return fallback;
    throw new PasteError('empty', '붙여 넣은 내용에서 JSON({ … })을 찾지 못했습니다. AI 답변 전체를 복사했는지 확인해 주세요.');
  }

  // Fill fields AI answers commonly omit. Only unambiguous defaults; returns notes.
  function normalize(scenario) {
    const fixes = [];
    if (!scenario || typeof scenario !== 'object' || Array.isArray(scenario)) return fixes;
    if (scenario.schemaVersion === undefined) { scenario.schemaVersion = scenario.map || scenario.reign || scenario.mode === 'reign' ? 2 : 1; fixes.push('schemaVersion'); }
    else if (scenario.schemaVersion === '1' || scenario.schemaVersion === '2') { scenario.schemaVersion = Number(scenario.schemaVersion); fixes.push('schemaVersion'); }
    if (scenario.schemaVersion === 2 && scenario.mode === undefined) { scenario.mode = scenario.reign ? 'reign' : 'chronicle'; fixes.push('mode'); }
    if (typeof scenario.id !== 'string' || !/^[a-z][a-z0-9_]*$/i.test(scenario.id)) { scenario.id = 'ai_scenario'; fixes.push('시나리오 id'); }
    if (scenario.flags === undefined) { scenario.flags = []; fixes.push('flags'); }
    if (scenario.draft !== undefined) { delete scenario.draft; fixes.push('draft 제거'); }
    if (Array.isArray(scenario.events)) scenario.events.forEach(event => {
      if (event && typeof event === 'object' && event.next === undefined) { event.next = 'END'; fixes.push(`사건 ${event.id || ''}의 next`); }
    });
    if (Array.isArray(scenario.endings)) {
      scenario.endings.forEach(ending => {
        if (!ending || typeof ending !== 'object') return;
        if (typeof ending.immediate !== 'boolean') { ending.immediate = ending.chance !== undefined; fixes.push(`엔딩 ${ending.id || ''}의 immediate`); }
        if (typeof ending.priority !== 'number') { ending.priority = Number(ending.priority) || 0; fixes.push(`엔딩 ${ending.id || ''}의 priority`); }
        if (!['good', 'mixed', 'bad'].includes(ending.kind)) { ending.kind = 'mixed'; fixes.push(`엔딩 ${ending.id || ''}의 kind`); }
      });
      const ids = new Set(scenario.endings.map(ending => ending && ending.id));
      if (!ids.has(scenario.defaultEnding)) {
        const fallback = scenario.endings.find(ending => ending && ending.immediate === false && (!ending.when || ending.when.length === 0));
        if (fallback) { scenario.defaultEnding = fallback.id; fixes.push('defaultEnding'); }
      }
    }
    if (Array.isArray(scenario.events) && scenario.events.length && !scenario.events.some(event => event && event.id === scenario.start)) {
      scenario.start = scenario.events[0] && scenario.events[0].id; fixes.push('start');
    }
    return fixes;
  }

  root.ScenarioAI = { EXAMPLE, SIZES, buildExample, buildPrompt, buildRepairPrompt, extract, normalize, PasteError };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script id="app-script">(function () {
  'use strict';

  async function importFile(file){
    if(!file)return;
    cancelPendingLoad();const sequence=loadSequence;launcherBusy=true;failedScenarioUrl=null;setLauncherFeedback('파일을 읽고 검사하고 있습니다.');
    try{
      if(file.size>MAX_SCENARIO_BYTES)throw Error('시나리오 파일은 최대 5 MB까지 불러올 수 있습니다.');
      const text=await file.text();if(sequence!==loadSequence)return;
      const prepared=prepareScenario(parseScenarioText(text));
      if(byId('editor-dialog').open&&ScenarioEditor.close()===false)throw Error('시나리오 교체를 취소했습니다.');
      commitScenario(prepared);closeLauncher();setLauncherFeedback('파일을 불러왔습니다.');
    }catch(error){if(sequence===loadSequence){setLauncherFeedback('',error.message);status('시나리오를 불러오지 못했습니다. 현재 작업은 유지됩니다.',true);}}
    finally{if(sequence===loadSequence){launcherBusy=false;updateLauncherFeedback();}}
  }
  async function responseText(response){
    const size=Number(response.headers?.get('content-length'));
    if(Number.isFinite(size)&&size>MAX_SCENARIO_BYTES)throw Error('시나리오 파일은 최대 5 MB까지 불러올 수 있습니다.');
    if(!response.body||typeof response.body.getReader!=='function')return checkedText(await response.text());
    const reader=response.body.getReader(),chunks=[];let total=0;
    try{
      while(true){const part=await reader.read();if(part.done)break;total+=part.value.byteLength;if(total>MAX_SCENARIO_BYTES){await reader.cancel();throw Error('시나리오 파일은 최대 5 MB까지 불러올 수 있습니다.');}chunks.push(part.value);}
    }finally{reader.releaseLock?.();}
    const bytes=new Uint8Array(total);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.byteLength;}
    try{return checkedText(new TextDecoder('utf-8',{fatal:true}).decode(bytes));}catch(error){if(error.message.includes('5 MB'))throw error;throw Error('시나리오는 UTF-8로 저장한 JSON 파일이어야 합니다.');}
  }
  async function loadScenarioUrl(path){
    cancelPendingLoad();const sequence=loadSequence;failedScenarioUrl=path;launcherBusy=true;setLauncherFeedback('주소에서 시나리오를 불러오고 있습니다.');
    let timeout;
    try{
      const current=new URL(location.href);
      if(!['http:','https:'].includes(current.protocol))throw Error('주소로 불러오기는 웹 주소에서만 사용할 수 있습니다. JSON 파일 불러오기를 이용해 주세요.');
      const url=new URL(path,current);
      if(!['http:','https:'].includes(url.protocol)||url.origin!==current.origin||url.username||url.password)throw Error('현재 프로그램과 같은 사이트의 JSON 주소만 불러올 수 있습니다. 파일을 내려받아 직접 열어 주세요.');
      const controller=new AbortController();pendingUrlController=controller;timeout=setTimeout(()=>controller.abort(),20000);
      const response=await fetch(url.href,{credentials:'same-origin',redirect:'error',signal:controller.signal});
      if(!response.ok)throw Error(`파일을 불러올 수 없습니다. 서버 응답: ${response.status}`);
      if(response.url&&new URL(response.url,current).origin!==current.origin)throw Error('다른 사이트로 이동하는 시나리오 주소는 불러올 수 없습니다.');
      const text=await responseText(response);if(sequence!==loadSequence)return null;
      const prepared=prepareScenario(parseScenarioText(text));
      if(byId('editor-dialog').open&&ScenarioEditor.close()===false)throw Error('시나리오 교체를 취소했습니다.');
      if(hash(prepared.scenario)!==signature())commitScenario(prepared);
      else saveSourceContext(storage.set('scenario',scenario));
      failedScenarioUrl=null;closeLauncher();setLauncherFeedback();status('주소의 시나리오를 불러왔습니다.');return E.clone(scenario);
    }catch(error){
      if(sequence!==loadSequence)return null;
      const message=error.name==='AbortError'?'주소에 연결하는 시간이 길어졌습니다. 다시 시도하거나 JSON 파일을 직접 열어 주세요.':error.message;
      setLauncherFeedback('',message);status('주소에서 불러오지 못했습니다. 현재 시나리오와 진행은 유지됩니다.',true);
      if(!isEmptyScenario())openLauncher();return null;
    }finally{clearTimeout(timeout);if(sequence===loadSequence){launcherBusy=false;pendingUrlController=null;updateLauncherFeedback();}}
  }
  function download(name,text,type='application/json'){
    const url=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  async function exportHTML(){
    try{
      let doc;
      if(byId('scenario-data')||byId('bootstrap-script'))doc=document.cloneNode(true);
      else{
        const response=await fetch('standalone.html');if(!response.ok)throw Error('다운로드 파일을 읽을 수 없습니다.');
        doc=new DOMParser().parseFromString(await response.text(),'text/html');
      }
      const blank=E.createBlankScenario(),embedded=doc.getElementById('scenario-data'),bootstrap=doc.getElementById('bootstrap-script');
      if(embedded)embedded.textContent=JSON.stringify(blank).replace(/</g,'\\u003c');
      else if(bootstrap)bootstrap.textContent='globalThis.DEFAULT_SCENARIO = GameEngine.createBlankScenario();';
      else throw Error('프로그램 내려받기 파일의 구성을 확인할 수 없습니다.');
      // Export only the bundled application, excluding browser-injected assets.
      const bundledScripts=new Set(['ai-script','engine-script','scenario-data','scenario-loader','bootstrap-script','flowchart-script','editor-script','app-script','map-templates-script','map-view-script']);
      doc.querySelectorAll('script').forEach(script=>{if(!bundledScripts.has(script.id))script.remove();});
      doc.querySelectorAll('link[rel="stylesheet"]').forEach(link=>link.remove());
      doc.querySelectorAll('style').forEach(style=>{if(!['game-styles','flowchart-styles','launcher-styles','map-view-styles','editor-v2-styles','standalone-styles'].includes(style.id))style.remove();});
      doc.querySelectorAll('dialog[open]').forEach(d=>d.removeAttribute('open'));
      doc.getElementById('editor-dialog').removeAttribute('data-editor-bound');
      doc.getElementById('editor-dialog').classList.remove('flowchart-mode');
      for(const id of ['editor-root','info-content','scenario-open-content','story-panel','stats-panel','flags-panel','turn-label','scenario-title','scenario-subtitle','scenario-description','risk-summary','toast','status-message','player-map','map-reference-tools']){const node=doc.getElementById(id);if(node){node.innerHTML='';node.textContent='';}}
      for(const id of ['flags-count','ending-count']){const node=doc.getElementById(id);if(node)node.textContent=id==='flags-count'?'0':'0 / 0 →';}
      const saveStatus=doc.getElementById('save-status');if(saveStatus)saveStatus.textContent='';
      doc.querySelectorAll('input').forEach(input=>{input.removeAttribute('value');input.value='';});
      doc.querySelectorAll('[data-web-only]').forEach(node=>node.remove());
      if(doc.getElementById('player-map-panel'))doc.getElementById('player-map-panel').hidden=true;
      doc.body.classList.remove('empty-workspace');doc.title='역사의 갈림길 · 시나리오 플레이어';
      doc.getElementById('toast').hidden=true;doc.getElementById('status-message').hidden=true;
      download('history-crossroads-player.html','<!doctype html>\n'+doc.documentElement.outerHTML,'text/html');
      notify('시나리오가 포함되지 않은 프로그램을 내려받았습니다. 원고는 JSON으로 별도 보관하세요.');
    }catch(error){status(error.message,true);}
  }
  function help(){
    info('이야기를 불러오고 직접 쓰세요',`<p>시나리오의 사건을 읽고 선택지를 누르면 수치와 선택 기록이 바뀝니다. 조건과 확률에 따라 다음 사건과 결말이 달라집니다.</p><ol><li><strong>시나리오 열기:</strong> JSON 파일을 선택하거나 불러오기 화면에 끌어다 놓으세요.</li><li><strong>직접 쓰기:</strong> 흐름도에서 사건과 돌발 사건을 추가하고, 카드에서 본문·선택지·조건·수치 변화를 고칩니다. 작성 중에는 ‘초안 저장’, 플레이할 준비가 되면 ‘적용하고 새 게임’을 누르세요.</li><li><strong>지도와 게임 방식:</strong> 편집기 기본 설정에서 연대기/치세를 고르고 지도 탭에서 템플릿과 시작 소유권을 설정합니다. 선택지에 지역 변화와 기준 역사 표시를 붙일 수 있습니다. 치세에서는 분야별로 결정한 뒤 정산하면 다음 해로 진행합니다.</li><li><strong>AI로 만들기:</strong> ‘시나리오 열기’의 ‘AI로 만들기’ 탭에서 요청문을 복사해 ChatGPT·Claude 같은 AI에 보내고, 받은 답변을 붙여 넣으면 바로 플레이합니다. 문제가 있으면 AI에게 보낼 수정 요청 문구도 만들어 줍니다.</li><li data-community-only><strong>갤러리:</strong> 위쪽 ‘갤러리’에서 다른 사람의 시나리오를 플레이하고 좋아요를 누를 수 있습니다. 완성한 시나리오는 ‘갤러리에 올리기’로 공개할 수 있습니다(구글 로그인 필요).</li><li><strong>원고 보관:</strong> 시나리오 JSON을 내보내 보관하세요. ‘프로그램 내려받기’에는 원고가 포함되지 않습니다.</li><li><strong>진행 저장:</strong> 자동 저장으로 이어 하거나, ‘진행 저장’과 ‘불러오기’로 같은 내용의 시나리오에서 저장 지점으로 돌아갑니다.</li></ol><p class="notice">시나리오와 진행은 접속한 브라우저에 각각 저장되며 다른 접속자와 공유되지 않습니다. 브라우저 데이터를 지우기 전에는 원고를 JSON으로 내보내세요.</p><div class="toolbar"><button class="btn primary" id="download-html">프로그램 내려받기</button><button class="btn secondary" id="download-json">시나리오 JSON 내보내기</button><button class="btn secondary" id="new-scenario">빈 시나리오 새로 작성</button><button class="btn secondary" type="button" data-launch-action="open-ai">✦ AI로 시나리오 만들기</button><a class="btn secondary" href="gallery.html#upload" data-community-only>갤러리에 올리기</a></div>`);
    byId('download-html').onclick=exportHTML;
    byId('download-json').onclick=()=>download('scenario.json',JSON.stringify(scenario,null,2));
    byId('new-scenario').onclick=()=>{byId('info-dialog').close();newScenario();};
  }
  function applyScenario(next){
    return commitScenario(prepareScenario(next));
  }
  function commitScenario(prepared){
    scenario=prepared.scenario;state=prepared.state;compareMap=false;referenceCache=null;
    awaitingName=Boolean(state&&playerSettings().askName!==false);nameReturnState=null;
    const saved=storage.set('scenario',scenario);saveSourceContext(saved);if(awaitingName)storage.set('autosave',null);else saveAuto();
    render();status(saved?(state?(awaitingName?'시나리오를 적용했습니다. 이름을 입력하고 시작하세요.':'시나리오를 적용했습니다. 새로운 역사를 시작하세요.'):'작성 중인 초안을 저장했습니다. 흐름도에서 이어서 작성하세요.'):'브라우저 저장이 불가능하므로 JSON으로 내보내 보관하세요.');
  }
  byId('story-panel').addEventListener('submit',event=>{
    if(event.target.id!=='player-name-form')return;
    event.preventDefault();startWithName(byId('player-name-input').value);
  });
  byId('story-panel').addEventListener('click',event=>{
    const partChoice=event.target.closest('[data-part-choice]');if(partChoice&&!partChoice.disabled){playReign(partChoice.dataset.partEvent,Number(partChoice.dataset.partChoice));return;}
    const choice=event.target.closest('[data-choice]');if(choice&&!choice.disabled){play(Number(choice.dataset.choice));return;}
    const action=event.target.closest('[data-action]')?.dataset.action;
    if(action==='settle-reign')settleReign();
    if(action==='restart')restart(false);if(action==='journal')journal();if(action==='collection')collection();
    if(action==='edit-flow')ScenarioEditor.open(scenario,applyScenario,{page:'flowchart'});
    if(action==='edit-scenario')ScenarioEditor.open(scenario,applyScenario);
    if(action==='default-name')startWithName(playerSettings().defaultName);
    if(action==='cancel-name'&&nameReturnState){state=nameReturnState;nameReturnState=null;awaitingName=false;render();status('이전 진행으로 돌아왔습니다.');}
  });
  byId('restart-button').onclick=()=>restart();byId('journal-button').onclick=journal;byId('collection-button').onclick=collection;byId('help-button').onclick=help;
  byId('edit-button').onclick=()=>ScenarioEditor.open(scenario,applyScenario);
  byId('flow-button').onclick=()=>ScenarioEditor.open(scenario,applyScenario,{page:'flowchart'});
  byId('open-scenario-button').onclick=openLauncher;
  byId('scenario-import').addEventListener('change',event=>{const file=event.target.files?.[0];event.target.value='';void importFile(file);});
  function chooseScenarioFile(){const input=byId('scenario-import');input.value='';input.click();}
  document.addEventListener('click',event=>{
    const action=event.target.closest('[data-launch-action]')?.dataset.launchAction;
    if(event.target.closest('[data-map-compare]')){compareMap=!compareMap;renderMap();return;}
    if(!action)return;
    try{
      if(action==='demo-chronicle'||action==='demo-reign')void loadScenarioUrl('examples/'+(action==='demo-chronicle'?'chronicle-sejong.json':'reign-france.json'));
      if(action==='choose-file')chooseScenarioFile();
      if(action==='new')newScenario();
      if(action==='close')closeLauncher();
      if(action==='retry-url'&&failedScenarioUrl&&!launcherBusy)void loadScenarioUrl(failedScenarioUrl);
      if(action==='mode-file'||action==='mode-ai'){launcherMode=action==='mode-ai'?'ai':'file';refreshLaunchers(`[data-launch-action="${action}"]`);}
      if(action==='ai-copy-prompt')void copyAIPrompt();
      if(action==='ai-copy-repair')void copyRepair();
      if(action==='ai-import')importPasted();
      if(action==='ai-clear'){ai.paste='';ai.problem=null;ai.repair='';refreshLaunchers('[data-ai-field="paste"]');}
      if(action==='open-ai'){byId('info-dialog').close();launcherMode='ai';openLauncher();}
    }catch(error){setLauncherFeedback('',error.message);}
  });
  const aiFieldInput=event=>{
    const field=event.target.closest?.('[data-ai-field]');if(!field)return;
    const key=field.dataset.aiField;ai[key]=field.type==='checkbox'?field.checked:field.value;
    if(key==='base'&&ai.base&&canUseBase()){
      ai.mode=scenario.mode||'chronicle';ai.mapTemplateId=scenario.map?.templateId||'';
      document.querySelectorAll('[data-ai-field="mode"]').forEach(node=>{node.value=ai.mode;});
      document.querySelectorAll('[data-ai-field="mapTemplateId"]').forEach(node=>{node.value=ai.mapTemplateId;});
    }
    if(key==='paste')return;
    ai.prompt='';ai.promptNote='';ai.showPrompt=document.querySelector('.ai-prompt-view[open] [data-ai-prompt]')!==null;
    const preview=ScenarioAI.buildPrompt(aiPromptOptions());
    document.querySelectorAll('[data-ai-prompt]').forEach(node=>{node.value=preview;});
    document.querySelectorAll('.ai-maker .ai-note').forEach(node=>{if(!node.closest('.ai-problem'))node.hidden=true;});
  };
  document.addEventListener('input',aiFieldInput);document.addEventListener('change',aiFieldInput);
  document.addEventListener('keydown',event=>{
    if(event.target.matches?.('[data-ai-field="paste"]')&&event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();importPasted();}
  });
  document.addEventListener('keydown',event=>{
    const zone=event.target.closest('[data-scenario-dropzone]');
    if(zone&&(event.key==='Enter'||event.key===' ')){event.preventDefault();chooseScenarioFile();}
  });
  document.addEventListener('dragover',event=>{
    const zone=event.target.closest('[data-scenario-dropzone]');
    if(zone||Array.from(event.dataTransfer?.types||[]).includes('Files'))event.preventDefault();
    if(zone){zone.classList.add('drag-over');if(event.dataTransfer)event.dataTransfer.dropEffect='copy';}
  });
  document.addEventListener('dragleave',event=>event.target.closest('[data-scenario-dropzone]')?.classList.remove('drag-over'));
  document.addEventListener('drop',event=>{
    const zone=event.target.closest('[data-scenario-dropzone]');
    if(!zone&&!Array.from(event.dataTransfer?.types||[]).includes('Files'))return;
    event.preventDefault();document.querySelectorAll('.drag-over').forEach(node=>node.classList.remove('drag-over'));
    if(!zone){status('‘시나리오 열기’의 파일 영역에 JSON 파일을 놓아 주세요.');return;}
    const files=event.dataTransfer?.files;
    if(files?.length!==1){setLauncherFeedback('','JSON 파일을 한 번에 하나씩 놓아 주세요.');return;}
    void importFile(files[0]);
  });
  byId('save-button').onclick=()=>{if(!state||awaitingName)return;const ok=storage.set('save',envelope());render();notify(ok?'현재 진행을 저장했습니다.':'저장할 수 없습니다. 브라우저 저장 설정을 확인해 주세요.');};
  byId('load-button').onclick=()=>{
    const saved=storage.get('save');if(!saved||saved.signature!==signature()){notify('현재 시나리오와 호환되는 저장이 없습니다.');return;}
    if(!awaitingName&&state.turn&&!confirm('직접 저장한 지점으로 돌아갈까요?'))return;
    try{state=E.restoreState(scenario,saved.state);awaitingName=false;nameReturnState=null;saveAuto();rememberEnding();render();status('저장한 진행을 불러왔습니다.');}catch(error){status('저장 불러오기 실패: '+error.message,true);}
  };
  document.addEventListener('keydown',event=>{
    if(!state||awaitingName||event.altKey||event.ctrlKey||event.metaKey||document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;
    if(reignMode()&&!state.activeRandomEventId&&/^[1-9]$/.test(event.key)){
      const index=Number(event.key)-1,cards=E.getReignStatus(scenario,state).cards;
      const card=cards.find(c=>!state.reign.decisions[c.part.id]);
      if(card?.choices.find(c=>c.index===index)?.enabled){event.preventDefault();playReign(card.event.id,index);}return;
    }
    if(/^[1-9]$/.test(event.key)){const index=Number(event.key)-1,item=E.getChoices(scenario,state).find(c=>c.index===index);if(item?.enabled){event.preventDefault();play(index);}}
  });
  try{
    state=scenario.draft===true?null:E.createState(scenario,{playerName:scenario.player?.defaultName||'집정관'});
    awaitingName=Boolean(state&&playerSettings().askName!==false);
    const auto=storage.get('autosave');if(state&&auto&&auto.signature===signature())try{state=E.restoreState(scenario,auto.state);awaitingName=false;}catch{status('이전 자동 저장을 읽지 못해 새 회차를 시작합니다.',true);}
    rememberEnding();render();
  }catch(error){status('시나리오를 시작할 수 없습니다: '+error.message,true);byId('scenario-title').textContent='시나리오를 확인해 주세요';}
  // Public handoff: raw manuscripts are JSON; the downloadable player stays blank.
  globalThis.HistoryCrossroads={getScenario:()=>E.clone(scenario),getState:()=>E.clone(state),importScenario,importText,newScenario,ready:Promise.resolve(null)};
  const scenarioPath=new URL(location.href).searchParams.get('scenario');
  if(scenarioPath){
    const savedContext=storage.get('sourceContext');
    if(hasStoredScenario&&savedContext?.context===sourceContext()&&savedContext.signature===signature()){
      status(state?'이 주소에서 저장한 시나리오와 진행을 이어갑니다.':'이 주소에서 저장한 편집 초안을 이어갑니다.');
      globalThis.HistoryCrossroads.ready=Promise.resolve(E.clone(scenario));
    }else globalThis.HistoryCrossroads.ready=loadScenarioUrl(scenarioPath);
  }
})();
