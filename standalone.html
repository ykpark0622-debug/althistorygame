<body>
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true">岐</span><div><strong>역사의 갈림길</strong><span>CHRONICLES OF CHOICE</span></div></div>
    <nav class="header-actions" aria-label="게임 도구"><button class="btn secondary" id="open-scenario-button">시나리오 열기</button><button class="btn subtle" id="help-button">사용 안내</button><button class="btn secondary flow-button" id="flow-button"><span aria-hidden="true">⑂</span> 분기 흐름도</button><button class="btn edit-button" id="edit-button"><span aria-hidden="true">✎</span> 시나리오 편집</button></nav>
  </header>
  <main class="layout">
    <div class="main-column">
      <section class="scenario-heading"><div><p class="eyebrow">A STORY YOU WILL WRITE</p><h1 id="scenario-title"></h1><p id="scenario-subtitle" class="scenario-subtitle"></p></div><span class="fiction-tag">선택형 이야기</span></section>
      <div id="status-message" class="status-message" role="status" aria-live="polite" hidden></div>
      <section id="story-panel" class="story-panel" aria-label="현재 사건" tabindex="-1"></section>
      <footer class="story-footer"><span class="keyboard-note">숫자 키 <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> 으로도 선택할 수 있습니다.</span><button class="text-button" id="journal-button">지나온 선택 보기 <span aria-hidden="true">↗</span></button></footer>
      <p class="fiction-note" id="scenario-description"></p>
    </div>
    <aside class="sidebar" aria-label="국가 현황">
      <section class="country-card"><div class="small-label">STATE OF THE NATION</div><div class="country-title"><span>국가 현황</span><span class="seal" aria-hidden="true">史</span></div><div class="turn-label" id="turn-label"></div><div id="stats-panel" class="stats-panel"></div><div id="risk-summary" class="risk-summary" hidden></div></section>
      <section class="memory-card"><div class="section-label"><h2>역사가 기억하는 것</h2><span id="flags-count" class="counter">0</span></div><div id="flags-panel"></div></section>
      <section class="save-card"><div class="save-buttons"><button class="btn secondary" id="save-button">진행 저장</button><button class="btn secondary" id="load-button">불러오기</button></div><button class="btn restart-button" id="restart-button">처음부터 다시</button><p id="save-status" class="save-caption"></p></section>
      <section class="collection-card"><button id="collection-button" class="collection-button"><span><span class="small-label">YOUR CHRONICLES</span><strong>발견한 결말</strong></span><span id="ending-count">0 / 0 <span aria-hidden="true">→</span></span></button></section>
      <p class="sidebar-note">선택에는 대가가 있습니다.<br>어떤 역사를 남길지는 당신의 몫입니다.</p>
    </aside>
  </main>
  <footer class="site-footer"><span>역사의 갈림길 · 시나리오 실험실</span><span>당신의 이야기로 다시 쓸 수 있습니다.</span></footer>
  <dialog id="editor-dialog" class="editor-dialog" aria-label="시나리오 편집"><div id="editor-root"></div></dialog>
  <dialog id="info-dialog" class="info-dialog" aria-label="게임 정보"><div id="info-content"></div><form method="dialog"><button class="btn secondary">닫기</button></form></dialog>
  <dialog id="scenario-open-dialog" class="scenario-open-dialog" aria-label="시나리오 열기"><div id="scenario-open-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input id="scenario-import" type="file" accept=".json,application/json" hidden>
  <script id="engine-script">
(function (root) {
  'use strict';

  const own = (object, key) => Object.prototype.hasOwnProperty.call(object || {}, key);
  const plain = value => Boolean(value) && typeof value === 'object' && !Array.isArray(value) && (Object.getPrototypeOf(value) === Object.prototype || Object.getPrototypeOf(value) === null);
  const finite = value => typeof value === 'number' && Number.isFinite(value);
  const reserved = new Set(['__proto__', 'prototype', 'constructor']);
  const validId = value => typeof value === 'string' && /^[a-z][a-z0-9_]*$/i.test(value) && !reserved.has(value.toLowerCase());
  const operators = new Set(['eq', 'ne', 'gte', 'lte', 'gt', 'lt']);
  const MAX_HISTORY = 5000;
  const uint32 = value => Number.isInteger(value) && value >= 0 && value <= 0xffffffff;
  const LEGACY_SEED = 0x4c454741;
  let lastFreshSeed = null;

  function freshSeed() {
    let seed = root.crypto && typeof root.crypto.getRandomValues === 'function'
      ? root.crypto.getRandomValues(new Uint32Array(1))[0]
      : (Date.now() ^ Math.floor(Math.random() * 0x100000000)) >>> 0;
    if (seed === lastFreshSeed) seed = (seed + 1) >>> 0;
    lastFreshSeed = seed;
    return seed;
  }

  // Mulberry32: the saved uint32 state is the sole source for gameplay rolls.
  // Changes to this algorithm would require a save-format migration.
  function rollPercent(state) {
    state.rngState = (state.rngState + 0x6d2b79f5) >>> 0;
    let value = state.rngState;
    value = Math.imul(value ^ value >>> 15, value | 1);
    value ^= value + Math.imul(value ^ value >>> 7, value | 61);
    return ((value ^ value >>> 14) >>> 0) / 0x100000000 * 100;
  }

  function clone(value) {
    return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
  }

  function normalizePlayerName(value) {
    if (value === undefined) return '집정관';
    if (typeof value !== 'string') throw new Error('이름은 문자열로 입력해 주세요.');
    if (/[\u0000-\u001f\u007f-\u009f\u2028\u2029]/.test(value)) throw new Error('이름에 줄바꿈이나 제어문자를 사용할 수 없습니다.');
    const name = value.trim();
    if (!name) throw new Error('이름을 입력해 주세요.');
    if (Array.from(name).length > 24) throw new Error('이름은 24자 이내로 입력해 주세요.');
    return name;
  }

  function formatText(text, state) {
    const source = String(text === undefined || text === null ? '' : text);
    if (!state) return source;
    const name = normalizePlayerName(state.playerName);
    return source.replace(/\{\{name\}\}|\{name\}/g, () => name);
  }

  function createBlankScenario() {
    return {
      schemaVersion: 1, id: 'blank_scenario', title: '새 시나리오', subtitle: '', description: '',
      start: null, stats: [], flags: [], events: [], endings: [], randomEvents: [], defaultEnding: null, draft: true
    };
  }

  function validateScenario(scenario, options = {}) {
    const errors = [];
    const warnings = [];
    const error = message => { if (errors.length < 100) errors.push(message); };
    const show = value => typeof value === 'string' ? value : JSON.stringify(value);
    const itemName = (item, index) => typeof item.id === 'string' ? item.id : index + 1;
    if (!plain(scenario)) return { errors: ['시나리오는 JSON 객체여야 합니다.'], warnings };
    if (!plain(options)) return { errors: ['검사 옵션은 객체여야 합니다.'], warnings };
    const draft = options.allowDraft === true && scenario.draft === true;

    // Imports stay data only. Reject dangerous object keys and non-JSON structures
    // before using any user-provided identifier as an object property.
    let nodes = 0;
    const ancestors = new Set();
    function inspect(value, depth) {
      if (++nodes > 50000) { error('시나리오 데이터가 너무 큽니다.'); return; }
      if (depth > 25) { error('시나리오의 중첩이 너무 깊습니다.'); return; }
      if (typeof value === 'number' && !Number.isFinite(value)) error('숫자는 유한한 값이어야 합니다.');
      if (value === null || typeof value !== 'object') {
        if (typeof value === 'function' || typeof value === 'symbol' || typeof value === 'bigint' || typeof value === 'undefined') error('시나리오에는 JSON으로 표현할 수 있는 값만 사용할 수 있습니다.');
        return;
      }
      if (!Array.isArray(value) && !plain(value)) { error('시나리오에는 일반 JSON 객체만 사용할 수 있습니다.'); return; }
      if (ancestors.has(value)) { error('시나리오 데이터에 순환 참조가 있습니다.'); return; }
      ancestors.add(value);
      for (const key of Object.keys(value)) {
        if (reserved.has(key.toLowerCase())) error(`사용할 수 없는 속성 이름입니다: ${key}`);
        inspect(value[key], depth + 1);
        if (nodes > 50000) break;
      }
      ancestors.delete(value);
    }
    inspect(scenario, 0);
    if (errors.length) return { errors, warnings };

    function textField(value, label, required = false, maxLength = 20000) {
      if (value === undefined && !required) return;
      if (typeof value !== 'string' || (required && !value.trim())) error(`${label}: ${required ? '비어 있지 않은 ' : ''}문자열이 필요합니다.`);
      else if (value.length > maxLength) error(`${label}: ${maxLength.toLocaleString()}자 이내로 작성해 주세요.`);
    }
    function collection(value, label, minimum, maximum) {
      if (!Array.isArray(value) || value.length < minimum || value.length > maximum) {
        error(`${label}: ${minimum}~${maximum}개의 항목으로 된 배열이 필요합니다.`);
        return [];
      }
      return value;
    }
    function ids(items, label) {
      const result = new Set();
      items.forEach((item, index) => {
        if (!plain(item)) { error(`${label} ${index + 1}: 객체가 필요합니다.`); return; }
        if (!validId(item.id)) error(`${label} ${index + 1}: ID는 영문자로 시작하는 영문·숫자·밑줄이어야 하며 예약어를 사용할 수 없습니다.`);
        else if (result.has(item.id)) error(`${label}: ID '${item.id}'가 중복되었습니다.`);
        else result.add(item.id);
      });
      return result;
    }

    if (scenario.schemaVersion !== 1) error('schemaVersion은 1이어야 합니다.');
    if (!validId(scenario.id)) error('시나리오 ID가 올바르지 않습니다.');
    textField(scenario.title, '시나리오 제목', true, 200);
    textField(scenario.subtitle, '부제', false, 1000);
    textField(scenario.description, '시나리오 설명');
    if (own(scenario, 'draft') && typeof scenario.draft !== 'boolean') error('draft는 true 또는 false여야 합니다.');
    if (own(scenario, 'player')) {
      if (!plain(scenario.player)) error('player는 플레이어 설정 객체여야 합니다.');
      else {
        if (own(scenario.player, 'askName') && typeof scenario.player.askName !== 'boolean') error('player.askName은 true 또는 false여야 합니다.');
        textField(scenario.player.label, '이름 입력 제목', false, 100);
        textField(scenario.player.placeholder, '이름 입력 안내', false, 100);
        if (own(scenario.player, 'defaultName')) {
          try { normalizePlayerName(scenario.player.defaultName); } catch (nameError) { error(`기본 이름: ${nameError.message}`); }
        }
      }
    }

    const stats = collection(scenario.stats, '능력치', draft ? 0 : 1, 20);
    const flags = collection(scenario.flags, '기록', 0, 200);
    const events = collection(scenario.events, '사건', draft ? 0 : 1, 1000);
    const endings = collection(scenario.endings, '엔딩', draft ? 0 : 1, 100);
    const randomEvents = scenario.randomEvents === undefined ? [] : collection(scenario.randomEvents, '랜덤 사건 규칙', 0, 200);
    const statIds = ids(stats, '능력치');
    const flagIds = ids(flags, '기록');
    const eventIds = ids(events, '사건');
    const endingIds = ids(endings, '엔딩');
    ids(randomEvents, '랜덤 사건 규칙');
    for (const id of eventIds) if (id === 'END' || id === 'RETURN') error(`사건 ID '${id}'는 경로 예약어이므로 사용할 수 없습니다.`);

    if (!(draft && events.length === 0 && scenario.start === null) && !eventIds.has(scenario.start)) error(`시작 사건 '${show(scenario.start)}'을 찾을 수 없습니다.`);
    if (!(draft && endings.length === 0 && scenario.defaultEnding === null) && !endingIds.has(scenario.defaultEnding)) error(`기본 엔딩 '${show(scenario.defaultEnding)}'을 찾을 수 없습니다.`);

    stats.forEach((stat, index) => {
      if (!plain(stat)) return;
      const label = `능력치 ${itemName(stat, index)}`;
      textField(stat.name, `${label} 이름`, true, 100);
      textField(stat.description, `${label} 설명`, false, 1000);
      if (!finite(stat.min) || !finite(stat.max) || stat.min >= stat.max) error(`${label}: 최소·최대는 유한한 숫자이며 최소 < 최대여야 합니다.`);
      if (!finite(stat.initial) || stat.initial < stat.min || stat.initial > stat.max) error(`${label}: 초기값은 최소~최대 사이의 숫자여야 합니다.`);
      if (stat.color !== undefined && (typeof stat.color !== 'string' || !/^#[0-9a-f]{6}$/i.test(stat.color))) error(`${label}: 색상은 #RRGGBB 형식이어야 합니다.`);
    });
    flags.forEach((flag, index) => {
      if (!plain(flag)) return;
      textField(flag.name, `기록 ${itemName(flag, index)} 이름`, true, 100);
      if (typeof flag.initial !== 'boolean') error(`기록 ${itemName(flag, index)}: 초기값은 true 또는 false여야 합니다.`);
    });

    function conditions(value, label) {
      if (value === undefined) return;
      if (!Array.isArray(value) || value.length > 100) { error(`${label}: 조건은 100개 이하의 배열이어야 합니다.`); return; }
      value.forEach((condition, index) => {
        const place = `${label} ${index + 1}`;
        if (!plain(condition)) { error(`${place}: 조건 객체가 필요합니다.`); return; }
        if (!operators.has(condition.op)) error(`${place}: 비교 연산자가 올바르지 않습니다.`);
        if (condition.kind === 'stat') {
          if (!statIds.has(condition.key)) error(`${place}: 능력치 '${show(condition.key)}'가 없습니다.`);
          if (!finite(condition.value)) error(`${place}: 능력치 비교값은 유한한 숫자여야 합니다.`);
        } else if (condition.kind === 'flag') {
          if (!flagIds.has(condition.key)) error(`${place}: 기록 '${show(condition.key)}'이 없습니다.`);
          if (typeof condition.value !== 'boolean') error(`${place}: 기록 비교값은 true 또는 false여야 합니다.`);
          if (condition.op !== 'eq' && condition.op !== 'ne') error(`${place}: 기록 비교에는 eq 또는 ne를 사용해 주세요.`);
        } else error(`${place}: 조건 종류는 stat 또는 flag여야 합니다.`);
      });
    }
    function next(value, label) {
      if (value !== 'END' && value !== 'RETURN' && !eventIds.has(value)) error(`${label}: 다음 사건 '${show(value)}'을 찾을 수 없습니다.`);
    }

    events.forEach((event, eventIndex) => {
      if (!plain(event)) return;
      const label = `사건 ${itemName(event, eventIndex)}`;
      textField(event.title, `${label} 제목`, true, 300);
      textField(event.body, `${label} 본문`, true);
      ['chapter', 'date', 'speaker'].forEach(field => textField(event[field], `${label} ${field}`, false, 300));
      conditions(event.when, `${label} 등장 조건`);
      next(event.next, `${label} 기본 경로`);
      const choices = collection(event.choices, `${label} 선택지`, 1, 20);
      choices.forEach((choice, index) => {
        const place = `${label} 선택지 ${index + 1}`;
        if (!plain(choice)) { error(`${place}: 객체가 필요합니다.`); return; }
        textField(choice.text, `${place} 내용`, true, 1000);

      if (!finite(rule.chance) || rule.chance < 0 || rule.chance > 100) error(`${label}: chance는 0~100 사이의 유한한 숫자여야 합니다.`);

  function testConditions(conditions, state) {

    if (!scenario.stats.every(stat => own(raw.stats, stat.id) && finite(raw.stats[stat.id]) && raw.stats[stat.id] === state.stats[stat.id])) return fail();

  function analyze(scenario) {
    const events = eventsOf(scenario);
    const ids = new Set(events.map(event => event.id));
    const edges = [];
    const warnings = [];
    const randomRules = rulesOf(scenario).map(rule => Object.assign({}, rule, { invalid: !ids.has(rule.eventId) }));
    events.forEach(event => {
      const add = (target, type, extra) => edges.push(Object.assign({ source: event.id, target, type, invalid: !specialTarget(target) && !ids.has(target) }, extra));
      add(event.next, 'default');
      choicesOf(event).forEach((choice, choiceIndex) => add(inherited(choice) ? event.next : choice.next, 'choice', { choiceIndex, inherited: inherited(choice) }));
      if (hasConditions(event)) add(event.next, 'skip');
    });
    const reachable = new Set();
    const pending = ids.has(scenario.start) ? [scenario.start] : [];
    if (pending.length) randomRules.filter(rule => !rule.invalid && rule.chance !== 0).forEach(rule => pending.push(rule.eventId));
    while (pending.length) {
      const id = pending.pop();
      if (reachable.has(id)) continue;
      reachable.add(id);
      edges.filter(edge => edge.source === id && edge.type !== 'default' && !edge.invalid && ids.has(edge.target)).forEach(edge => pending.push(edge.target));
    }
    if (events.length && !ids.has(scenario.start)) warnings.push({ message: '시작 사건을 찾을 수 없습니다: ' + (scenario.start || '(미지정)'), eventId: null });
    const broken = new Set();
    edges.filter(edge => edge.invalid).forEach(edge => {
      const key = edge.source + '\n' + edge.target;
      if (broken.has(key)) return;
      broken.add(key);
      warnings.push({ message: edge.source + ' → ' + (edge.target || '(미지정)') + ': 대상 사건이 없습니다.', eventId: edge.source });
    });
    events.filter(event => !reachable.has(event.id)).forEach(event => warnings.push({ message: event.id + ': 시작 사건에서 이어지는 경로가 없습니다.', eventId: event.id }));
    randomRules.filter(rule => rule.invalid).forEach(rule => warnings.push({ message: (rule.title || rule.id || '중간사건 규칙') + ': 대상 사건 ' + (rule.eventId || '(미지정)') + '을 찾을 수 없습니다.', eventId: null }));
    return { edges, reachableIds: Array.from(reachable), warnings, randomRules };
  }

    function updateTransform() {

    function fit() {

      if (bounds.width < 5 || bounds.height < 5) return;
      scale = Math.max(0.12, Math.min(1, (bounds.width - 36) / size.width, (bounds.height - 36) / size.height));

    function zoomAt(next, clientX, clientY) {

      const clamped = Math.max(0.12, Math.min(2, next));
      const factor = clamped / scale;
      pan = { x: point.x - (point.x - pan.x) * factor, y: point.y - (point.y - pan.y) * factor };

    function ruleLabel(rule) {

    function renderInspector() {

      return Array.from(cards.entries()).some(([id, entry]) => entry.node.offsetHeight > 0 && entry.node.offsetHeight !== positions.get(id)?.height);
    }
    function updateBounds() {
      size.width = 450;
      size.height = 250;
      positions.forEach(position => {
        size.width = Math.max(size.width, position.x + position.width + 70);
        size.height = Math.max(size.height, position.y + position.height + 55);
      });
      world.style.width = size.width + 'px';
      world.style.height = size.height + 'px';
      lines.setAttribute('width', size.width);
      lines.setAttribute('height', size.height);
      dragLines.setAttribute('width', size.width);
      dragLines.setAttribute('height', size.height);
    }

    // Rounded orthogonal routes use the whitespace around cards, including for
    // reverse edges and repeated destinations. Separate ports retain each choice.
    function roundedPath(points) {
      if (points.length < 2) return '';
      let result = 'M ' + points[0].x + ' ' + points[0].y;
      for (let index = 1; index < points.length - 1; index++) {
        const previous = points[index - 1], current = points[index], next = points[index + 1];
        const beforeLength = Math.hypot(current.x - previous.x, current.y - previous.y);
        const afterLength = Math.hypot(next.x - current.x, next.y - current.y);
        if (!beforeLength || !afterLength) continue;
        const radius = Math.min(9, beforeLength / 2, afterLength / 2);
        const before = { x: current.x - (current.x - previous.x) / beforeLength * radius, y: current.y - (current.y - previous.y) / beforeLength * radius };
        const after = { x: current.x + (next.x - current.x) / afterLength * radius, y: current.y + (next.y - current.y) / afterLength * radius };
        result += ' L ' + before.x + ' ' + before.y + ' Q ' + current.x + ' ' + current.y + ' ' + after.x + ' ' + after.y;

      const last = points[points.length - 1];

    function drawLines() {
      lines.replaceChildren();
      const defs = svgElement('defs');
      ['default', 'choice', 'skip', 'active'].forEach(kind => {
        const marker = svgElement('marker', { id: uid + '-' + kind, viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse', markerUnits: 'strokeWidth' });
        marker.append(svgElement('path', { d: 'M 0 0 L 8 4 L 0 8 z', class: 'branch-arrow-' + kind }));
        defs.append(marker);

      const sorted = model.edges.filter(edge => !edge.invalid).sort((a, b) => Number(a.source === selectedId || a.target === selectedId) - Number(b.source === selectedId || b.target === selectedId));
      sorted.forEach(edge => {
        const source = positions.get(edge.source), target = positions.get(edge.target);
        const sourceCard = cards.get(edge.source), targetCard = cards.get(edge.target);
        if (!source || !target || !sourceCard || !targetCard) return;
        const row = edge.type === 'choice' ? sourceCard.choiceRows[edge.choiceIndex] : sourceCard.defaultRow;
        if (!row) return;
        const active = edge.source === selectedId || edge.target === selectedId;
        const specific = active && edge.source === selectedId && edge.type === 'choice' && edge.choiceIndex === selectedChoice;
        const rank = edge.type === 'choice' ? edge.choiceIndex : edge.type === 'skip' ? sourceCard.choiceRows.length + 1 : sourceCard.choiceRows.length;
        const offset = Math.min(rank, 7) * 3;
        const sameRow = Math.abs(source.y - target.y) < 20;
        const isSelf = edge.source === edge.target;
        const towardsRight = target.x > source.x;
        const sourceX = source.x + source.width;

        if (edge.type === 'skip') sourceY += 5;

        const targetGutter = targetX - 16 - offset;
        let points;
        if (sameRow && !isSelf && towardsRight && Math.abs(source.x - target.x) < 350) {
          const midpoint = (sourceX + targetX) / 2 + (towardsRight ? 1 : -1) * (offset - 10);
          points = [{ x: sourceX, y: sourceY }, { x: midpoint, y: sourceY }, { x: midpoint, y: targetY }, { x: targetX, y: targetY }];
        } else {
          let routeY;
          if (isSelf) routeY = Math.max(10, source.y - 16 - offset);
          else if (target.y > source.y) routeY = source.y + source.height + 16 + offset;
          else routeY = Math.max(10, source.y - 16 - offset);
          points = [{ x: sourceX, y: sourceY }, { x: sourceGutter, y: sourceY }, { x: sourceGutter, y: routeY }, { x: targetGutter, y: routeY }, { x: targetGutter, y: targetY }, { x: targetX, y: targetY }];
        }
        const path = svgElement('path', { d: roundedPath(points), class: 'branch-edge branch-edge-' + edge.type + (active ? ' branch-edge-active' : '') + (specific ? ' branch-edge-specific' : ''), 'marker-end': 'url(#' + uid + '-' + (specific ? 'active' : edge.type) + ')' });
        const title = svgElement('title');
        title.textContent = edge.source + ' → ' + edge.target + ' · ' + (edge.type === 'choice' ? '선택 ' + (edge.choiceIndex + 1) + (edge.inherited ? ' (기본 연결 따름)' : '') : edge.type === 'skip' ? '등장 조건 불충족' : '기본 연결');
        path.append(title);
        lines.append(path);
        lines.append(svgElement('circle', { cx: sourceX, cy: sourceY, r: specific ? 4 : 3, class: 'branch-port branch-port-' + edge.type }));
      });
    }

    function pointerDown(event) {
      if (event.button !== 0) return;
      if (event.target.closest('.branch-empty-canvas')) return;
      if (dragging) cancelDrag();
      const port = event.target.closest('.branch-output-port');
      const handle = event.target.closest('.branch-node-handle');
      if (port) {
        const id = port.dataset.branchSource;
        const choiceIndex = port.dataset.branchChoice === 'default' ? null : Number(port.dataset.branchChoice);
        chosen(id, choiceIndex === null ? undefined : choiceIndex);
        const bounds = port.getBoundingClientRect();
        dragging = { kind: 'connection', id, choiceIndex, x: event.clientX, y: event.clientY, pointerId: event.pointerId, started: false,
          start: worldPoint(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2), port, dropId: null };
      } else if (handle) {
        const id = handle.dataset.branchDrag;
        const position = positions.get(id);
        chosen(id);
        dragging = { kind: 'node', id, x: event.clientX, y: event.clientY, startX: position.x, startY: position.y, pointerId: event.pointerId };
      } else if (!event.target.closest('.branch-node')) {
        dragging = { kind: 'pan', x: event.clientX, y: event.clientY, startX: pan.x, startY: pan.y, pointerId: event.pointerId };
      }
      if (dragging) {
        if (dragging.kind !== 'connection') {
          fitMode = false;
          stage.classList.add('branch-dragging');
        }
        stage.setPointerCapture(event.pointerId);
        event.preventDefault();
      }
    }
    function worldPoint(clientX, clientY) {
      const bounds = stage.getBoundingClientRect();
      return { x: (clientX - bounds.left - pan.x) / scale, y: (clientY - bounds.top - pan.y) / scale };
    }
    function dropTarget(clientX, clientY) {
      const bounds = stage.getBoundingClientRect();
      if (clientX < bounds.left || clientX > bounds.right || clientY < bounds.top || clientY > bounds.bottom) return null;
      const hit = document.elementFromPoint(clientX, clientY)?.closest('.branch-node');
      return hit && nodeLayer.contains(hit) && cards.has(hit.dataset.branchEvent) ? hit.dataset.branchEvent : null;
    }
    function drawPendingConnection(clientX, clientY) {
      if (!dragging || dragging.kind !== 'connection') return;
      const targetId = dropTarget(clientX, clientY);
      if (dragging.dropId !== targetId) {
        if (dragging.dropId) cards.get(dragging.dropId)?.node.classList.remove('branch-drop-target');
        if (targetId) cards.get(targetId)?.node.classList.add('branch-drop-target');
        dragging.dropId = targetId;
      }
      if (!dragging.path) {
        dragging.path = svgElement('path', { class: 'branch-pending-edge' });
        dragLines.append(dragging.path);
      }
      const start = dragging.start;
      const end = targetId ? { x: positions.get(targetId).x, y: positions.get(targetId).y + 32 } : worldPoint(clientX, clientY);
      const bend = Math.max(40, Math.min(140, Math.abs(end.x - start.x) * 0.45));
      dragging.path.setAttribute('d', 'M ' + start.x + ' ' + start.y + ' C ' + (start.x + bend) + ' ' + start.y + ' ' + (end.x - bend) + ' ' + end.y + ' ' + end.x + ' ' + end.y);
      dragging.path.classList.toggle('branch-pending-valid', Boolean(targetId));
    }
    function pointerMove(event) {
      if (!dragging || event.pointerId !== dragging.pointerId) return;
      const dx = event.clientX - dragging.x, dy = event.clientY - dragging.y;
      if (dragging.kind === 'connection') {
        if (!dragging.started && Math.hypot(dx, dy) < 4) return;
        if (!dragging.started) {
          dragging.started = true;
          fitMode = false;
          stage.classList.add('branch-connecting');
          dragging.port.classList.add('branch-output-active');
        }
        drawPendingConnection(event.clientX, event.clientY);
      } else if (dragging.kind === 'pan') {
        pan = { x: dragging.startX + dx, y: dragging.startY + dy };
        updateTransform();
      } else {
        const position = positions.get(dragging.id), card = cards.get(dragging.id);
        position.x = Math.max(35, dragging.startX + dx / scale);
        position.y = Math.max(40, dragging.startY + dy / scale);
        position.manual = true;
        card.node.style.left = position.x + 'px';
        card.node.style.top = position.y + 'px';
        updateBounds();
        drawLines();
      }
    }
    function cancelDrag() {
      const previous = dragging;
      dragging = null;
      stage.classList.remove('branch-dragging', 'branch-connecting');
      dragLines.replaceChildren();
      if (previous?.dropId) cards.get(previous.dropId)?.node.classList.remove('branch-drop-target');
      if (previous?.port) previous.port.classList.remove('branch-output-active');

    }
    function pointerUp(event) {
      if (!dragging || event.pointerId !== dragging.pointerId) return;
      const previous = dragging;
      const targetId = previous.kind === 'connection' && previous.started ? dropTarget(event.clientX, event.clientY) : null;
      cancelDrag();
      if (targetId && connect(scenario, previous.id, previous.choiceIndex, targetId)) {
        onChange();
        renderGraph();
        chosen(previous.id, previous.choiceIndex === null ? undefined : previous.choiceIndex);
        status.textContent = previous.id + ' · ' + (previous.choiceIndex === null ? '기본 연결' : '선택 ' + (previous.choiceIndex + 1)) + ' → ' + targetId + ' 연결됨 · ‘적용하고 새 게임’으로 반영';
      } else if (previous.kind === 'connection' && previous.started) status.textContent = '연결을 취소했습니다. 기존 다음 사건을 유지합니다.';
    }
    function pointerCancelled(event) {
      if (dragging && event.pointerId === dragging.pointerId) cancelDrag();
    }
    function escapeDrag(event) {
      if (event.key === 'Escape' && dragging?.kind === 'connection') {
        event.preventDefault();
        event.stopPropagation();

      if (dragging?.kind === 'connection') return;
      if (event.ctrlKey || event.metaKey) zoomAt(scale * Math.exp(-event.deltaY * 0.008), event.clientX, event.clientY);

        pan.y -= event.deltaY;

        event.preventDefault();

        pan.y += directions[event.key][1];
        fitMode = false;
        updateTransform();
      } else if (event.key === '+' || event.key === '=') { event.preventDefault(); zoomAt(scale * 1.2); }
      else if (event.key === '-') { event.preventDefault(); zoomAt(scale / 1.2); }
      else if (event.key === '0') { event.preventDefault(); fit(); }

    stage.addEventListener('pointerdown', pointerDown);
    stage.addEventListener('pointermove', pointerMove);
    stage.addEventListener('pointerup', pointerUp);
    stage.addEventListener('pointercancel', pointerCancelled);
    stage.addEventListener('lostpointercapture', pointerCancelled);
    stage.addEventListener('wheel', wheel, { passive: false });
    stage.addEventListener('keydown', keydown);
    host.addEventListener('keydown', escapeDrag, true);

    return () => {
      disposed = true;
      cancelDrag();

      if (editFrame) cancelAnimationFrame(editFrame);
      if (resizeObserver) resizeObserver.disconnect();
      stage.removeEventListener('pointerdown', pointerDown);
      stage.removeEventListener('pointermove', pointerMove);
      stage.removeEventListener('pointerup', pointerUp);
      stage.removeEventListener('pointercancel', pointerCancelled);
      stage.removeEventListener('lostpointercapture', pointerCancelled);

  <script id="editor-script">
/* Scenario editor: plain data in, plain data out. No network or executable scenario code. */
(function () {
  'use strict';

  let current = null;
  let resetUndo = null;
  const $ = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = String(text);
    return node;
  };
  const copy = value => globalThis.GameEngine && typeof GameEngine.clone === 'function'
    ? GameEngine.clone(value) : JSON.parse(JSON.stringify(value));
  const tabs = [
    ['overview', '기본 설정'], ['stats', '수치'], ['flags', '선택 기록'],
    ['events', '사건·선택지'], ['flowchart', '분기 흐름도'], ['randomEvents', '돌발 사건'], ['endings', '엔딩'], ['json', 'JSON']
  ];
  const mark = () => { if (current) current.dirty = true; };

  function button(text, action, style = 'secondary') {
    const node = $('button', 'btn ' + style, text);
    node.type = 'button';
    node.addEventListener('click', action);
    return node;
  }

  function input(label, value, action, options = {}) {
    const wrap = $('label', 'field');
    wrap.append($('span', '', label));
    const node = $(options.multiline ? 'textarea' : 'input', options.compact ? 'compact-input' : '');
    if (!options.multiline) node.type = options.type || 'text';
    else node.rows = options.rows || 4;
    if (options.step) node.step = options.step;
    if (options.min !== undefined) node.min = String(options.min);
    if (options.max !== undefined) node.max = String(options.max);
    if (options.maxLength !== undefined) node.maxLength = options.maxLength;
    if (options.maxCodePoints !== undefined) node.maxLength = options.maxCodePoints * 2;
    node.value = value === undefined || value === null ? '' : String(value);
    if (options.placeholder) node.placeholder = options.placeholder;
    if (options.disabled) node.disabled = true;
    node.addEventListener('input', event => {
      if (options.maxCodePoints !== undefined && !event?.isComposing) {
        node.value = Array.from(node.value).slice(0, options.maxCodePoints).join('');
      }
      const result = options.type === 'number' ? Number(node.value) : node.value;
      action(result);
      mark();
    });
    wrap.append(node);
    if (options.help) wrap.append($('span', 'small muted', options.help));
    return wrap;
  }

  function select(label, value, items, action, options = {}) {
    const wrap = $('label', 'field');
    if (label) wrap.append($('span', '', label));
    const node = $('select', options.compact ? 'compact-input' : '');
    const choices = items.map(item => Array.isArray(item) ? item : [item, item]);
    if (value !== undefined && !choices.some(item => String(item[0]) === String(value))) {
      choices.unshift([value, '⚠ 찾을 수 없음: ' + value]);
    }
    choices.forEach(([key, title]) => {
      const option = $('option', '', title);
      option.value = key;
      node.append(option);
    });
    node.value = value === undefined ? '' : String(value);
    node.addEventListener('change', () => { action(node.value); mark(); });
    wrap.append(node);
    if (options.help) wrap.append($('span', 'small muted', options.help));
    return wrap;
  }

  function checkbox(label, value, action, help) {
    const wrap = $('label', 'field-row');
    const node = $('input');
    node.type = 'checkbox';
    node.checked = Boolean(value);
    node.addEventListener('change', () => { action(node.checked); mark(); });
    wrap.append(node, $('span', '', label));
    if (help) wrap.append($('span', 'small muted', help));
    return wrap;
  }

  function section(title, help) {
    const node = $('section', 'editor-section');
    node.append($('h3', '', title));
    if (help) node.append($('p', 'small muted', help));
    return node;
  }

  function grid(...children) {
    const node = $('div', 'form-grid');
    node.append(...children);
    return node;
  }

  function notice(text) { return $('p', 'notice small', text); }

  function eventOptions(inherit) {
    const list = inherit ? [['', '사건의 다음 장면을 따름']] : [];
    list.push(['END', '이야기 종료 → 엔딩 판정']);
    list.push(['RETURN', '중간 사건 종료 → 원래 흐름으로 복귀']);
    current.draft.events.forEach(event => list.push([event.id, event.id + ' · ' + (event.title || '제목 없음')]));
    return list;
  }

  function allocate(prefix) {
    const draft = current.draft;
    const taken = new Set([draft.id, ...draft.stats.map(item => item.id), ...draft.flags.map(item => item.id),
      ...draft.events.map(item => item.id), ...draft.endings.map(item => item.id), ...(draft.randomEvents || []).map(item => item.id)]);
    let index = 1;
    while (taken.has(prefix + '_' + index)) index += 1;
    return prefix + '_' + index;
  }

  function validation(data, options = { allowDraft: true }) {
    try {
      const result = GameEngine.validateScenario(data, options);
      if (Array.isArray(result)) return { errors: result, warnings: [] };
      if (!result) return { errors: [], warnings: [] };
      return { errors: result.errors || [], warnings: result.warnings || [] };
    } catch (error) {
      return { errors: ['검사 오류: ' + error.message], warnings: [] };
    }
  }

  function playReport(data) {
    const playable = copy(data);
    delete playable.draft;
    const result = validation(playable, {});
    if (data.draft && result.errors.length) {
      result.errors.unshift('아직 플레이할 수 없는 초안입니다. 수치·시작 사건·기본 엔딩을 만들고 아래 항목을 채워 주세요. 현재 내용은 “초안 저장”으로 보관할 수 있습니다.');
    }
    return result;
  }

  function messageText(item) {
    if (typeof item === 'string') return item;
    if (item && item.message) return (item.path ? item.path + ': ' : '') + item.message;
    return JSON.stringify(item);
  }

  function showReport(result, success) {
    const box = document.getElementById('editor-report');
    if (!box) return;
    box.replaceChildren();
    if (result.errors.length) {
      box.append($('strong', '', '고칠 항목 ' + result.errors.length + '개'));
      const list = $('ul', 'error-list');
      result.errors.forEach(error => list.append($('li', '', messageText(error))));
      box.append(list);
    } else {
      box.append($('p', 'notice small', success || '검사를 통과했습니다.'));
    }
    if (result.warnings.length) {
      box.append($('strong', '', '확인할 사항'));
      const list = $('ul', 'error-list');
      result.warnings.forEach(warning => list.append($('li', '', messageText(warning))));
      box.append(list);
    }
    box.hidden = false;
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function builder(list, title, help) {
    const wrap = section(title, help || '아래 조건을 모두 만족해야 합니다. 조건이 없으면 항상 허용됩니다.');
    const rows = $('div');
    wrap.append(rows);

    function renderRows() {
      rows.replaceChildren();
      if (!list.length) rows.append($('p', 'small muted', '조건 없음 · 항상 허용'));
      list.forEach((condition, index) => {
        const row = $('div', 'condition-row');
        const isFlag = condition.kind === 'flag';
        const keys = (isFlag ? current.draft.flags : current.draft.stats).map(item => [item.id, item.name + ' (' + item.id + ')']);
        const operators = isFlag
          ? [['eq', '같음'], ['ne', '다름']]
          : [['gte', '이상 ≥'], ['lte', '이하 ≤'], ['eq', '같음 ='], ['ne', '다름 ≠'], ['gt', '초과 >'], ['lt', '미만 <']];
        row.append(
          select('종류', condition.kind, [['stat', '수치'], ['flag', '선택 기록']], value => {
            condition.kind = value;
            condition.key = (value === 'flag' ? current.draft.flags : current.draft.stats)[0]?.id || '';
            condition.op = value === 'flag' ? 'eq' : 'gte';
            condition.value = value === 'flag' ? true : 50;
            renderRows();
          }, { compact: true }),
          select('대상', condition.key, keys, value => { condition.key = value; }, { compact: true }),
          select('비교', condition.op, operators, value => { condition.op = value; }, { compact: true })
        );
        row.append(isFlag
          ? select('값', String(condition.value), [['true', '참 · 있음'], ['false', '거짓 · 없음']], value => { condition.value = value === 'true'; }, { compact: true })
          : input('기준값', condition.value, value => { condition.value = value; }, { type: 'number', compact: true, step: 'any' }));
        row.append(button('삭제', () => { list.splice(index, 1); mark(); renderRows(); }, 'danger'));
        rows.append(row);
      });
    }
    renderRows();
    const addCondition = button('＋ 조건 추가', () => {
      const hasStat = current.draft.stats.length > 0;
      list.push({ kind: hasStat ? 'stat' : 'flag', key: (hasStat ? current.draft.stats : current.draft.flags)[0]?.id || '',
        op: hasStat ? 'gte' : 'eq', value: hasStat ? 50 : true });
      mark();
      renderRows();
    });
    addCondition.disabled = !current.draft.stats.length && !current.draft.flags.length;
    wrap.append(addCondition);
    if (addCondition.disabled) wrap.append($('p', 'small muted', '조건을 만들려면 수치 또는 선택 기록을 먼저 추가하세요.'));
    return wrap;
  }

  function renderOverview(content) {

  function move(list, index, direction) {
    const target = index + direction;
    if (target < 0 || target >= list.length) return index;
    [list[index], list[target]] = [list[target], list[index]];
    mark();
    return target;
  }

  function renderChoices(content, event) {
    const choices = section('선택지', '수치 효과는 증가·감소량입니다. 예: 15는 +15, -10은 -10입니다. 선택 기록은 “유지”를 고르면 기존 값을 그대로 둡니다.');
    event.choices.forEach((choice, index) => {
      const card = $('section', 'editor-card');
      card.append($('h4', '', '선택지 ' + (index + 1)));
      card.append(input('버튼에 표시할 문장', choice.text, value => { choice.text = value; }));
      card.append(input('보충 설명', choice.description, value => { choice.description = value; }, { multiline: true, rows: 2 }));
      if (!choice.effects || typeof choice.effects !== 'object') choice.effects = {};
      if (!choice.setFlags || typeof choice.setFlags !== 'object') choice.setFlags = {};
      const effects = $('div', 'effects-grid');
      current.draft.stats.forEach(stat => effects.append(input(stat.name + ' 변화', choice.effects[stat.id] || 0, value => {
        if (value === 0) delete choice.effects[stat.id];
        else choice.effects[stat.id] = value;
      }, { type: 'number', compact: true, step: 'any' })));
      card.append(effects);
      const flags = $('div', 'effects-grid');
      current.draft.flags.forEach(flag => flags.append(select(flag.name,
        Object.prototype.hasOwnProperty.call(choice.setFlags, flag.id) ? String(choice.setFlags[flag.id]) : '',
        [['', '유지'], ['true', '참으로 기록'], ['false', '거짓으로 기록']], value => {
          if (value === '') delete choice.setFlags[flag.id];
          else choice.setFlags[flag.id] = value === 'true';
        }, { compact: true })));
      card.append(flags);
      const knownStats = new Set(current.draft.stats.map(stat => stat.id));
      const knownFlags = new Set(current.draft.flags.map(flag => flag.id));
      const orphans = [
        ...Object.keys(choice.effects).filter(key => !knownStats.has(key)).map(key => ['effects', key]),
        ...Object.keys(choice.setFlags).filter(key => !knownFlags.has(key)).map(key => ['setFlags', key])
      ];
      if (orphans.length) {
        const stale = $('div', 'notice');
        stale.append($('p', 'small', '삭제되었거나 이름이 바뀐 ID가 남아 있습니다. 제거하거나 JSON에서 수정하세요.'));
        orphans.forEach(([kind, key]) => stale.append(button(key + ' 연결 제거', () => {
          delete choice[kind][key]; mark(); render();
        }, 'danger')));
        card.append(stale);
      }
      card.append(select('선택 후 다음 장면', choice.next || '', eventOptions(true), value => {
        if (value) choice.next = value;
        else delete choice.next;
      }));
      if (!Array.isArray(choice.when)) choice.when = [];
      card.append(builder(choice.when, '선택 가능한 조건', '조건을 모두 만족할 때 이 선택지를 고를 수 있습니다. 충족하지 못한 선택지는 플레이 화면에서 잠깁니다.'));
      const toolbar = $('div', 'toolbar');
      const up = button('↑', () => { move(event.choices, index, -1); render(); });
      const down = button('↓', () => { move(event.choices, index, 1); render(); });
      up.disabled = index === 0;
      down.disabled = index === event.choices.length - 1;
      toolbar.append(up, down, button('복제', () => {
        event.choices.splice(index + 1, 0, copy(choice)); mark(); render();
      }), button('선택지 삭제', () => {
        event.choices.splice(index, 1); mark(); render();
      }, 'danger'));
      card.append(toolbar);
      choices.append(card);
    });
    choices.append(button('＋ 선택지 추가', () => {
      event.choices.push({ text: '새 선택지', description: '', effects: {}, setFlags: {}, when: [] });
      mark(); render();
    }));
    content.append(choices);
  }

    }
    if (!Array.isArray(ending.when)) ending.when = [];

  function parseJSON(text) {
    let value;
    try { value = JSON.parse(text); }
    catch (error) { return { errors: ['JSON 문법 오류: ' + error.message], warnings: [], value: null }; }
    const report = validation(value);
    return { ...report, value };
  }

  function acceptJSON(redraw) {
    const result = parseJSON(current.jsonBuffer);
    if (result.errors.length) { showReport(result); return false; }
    current.draft = copy(result.value);
    current.jsonDirty = false;
    current.dirty = true;
    if (redraw) render();
    showReport(result, 'JSON 내용을 편집 초안에 반영했습니다. 게임에 넣으려면 “적용하고 새 게임”을 누르세요.');
    return true;
  }

  function renderJSON(content) {
    content.append($('h2', '', 'JSON 직접 편집'));
    content.append(notice('전체 시나리오를 한 번에 수정하거나 다른 편집기로 옮길 수 있습니다. “JSON을 편집 초안에 반영”을 누르면 문법과 연결을 검사합니다. JSON 내보내기는 현재 초안을 파일로 저장합니다.'));
    if (!current.jsonDirty) current.jsonBuffer = JSON.stringify(current.draft, null, 2);
    const wrap = $('label', 'field');
    wrap.append($('span', '', '전체 시나리오 JSON'));
    const area = $('textarea', 'json-editor');
    area.rows = 26;
    area.spellcheck = false;
    area.value = current.jsonBuffer;
    area.addEventListener('input', () => { current.jsonBuffer = area.value; current.jsonDirty = true; mark(); });
    wrap.append(area);
    content.append(wrap);
    const toolbar = $('div', 'toolbar');
    toolbar.append(button('JSON을 편집 초안에 반영', () => acceptJSON(true), 'primary'), button('JSON 편집 취소', () => {
      if (current.jsonDirty && !confirm('이 화면에서 수정한 JSON을 버리고 편집 초안으로 되돌릴까요?')) return;
      current.jsonDirty = false; render();
    }));
    content.append(toolbar);
  }

  function exportJSON() {
    let text;
    if (current.jsonDirty) {
      const result = parseJSON(current.jsonBuffer);
      if (result.errors.length) { showReport(result); return; }
      text = JSON.stringify(result.value, null, 2);
    } else {
      const result = validation(current.draft);
      if (result.errors.length) { showReport(result); return; }
      text = JSON.stringify(current.draft, null, 2);
    }
    const blob = new Blob([text + '\n'], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = $('a');
    anchor.href = url;
    const safeID = String(current.draft.id || 'scenario').replace(/[^a-zA-Z0-9_-]/g, '_');
    anchor.download = safeID + '.json';
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showReport({ errors: [], warnings: [] }, '현재 편집 초안을 JSON으로 내보냈습니다. 게임에도 적용하려면 “적용하고 새 게임”을 누르세요.');
  }

  function importJSON(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showReport({ errors: ['JSON 파일은 5MB 이하로 준비해 주세요.'], warnings: [] }); return; }
    const owner = current;
    const reader = new FileReader();
    reader.addEventListener('load', () => {
      if (current !== owner) return;
      const result = parseJSON(String(reader.result).replace(/^\uFEFF/, ''));
      if (result.errors.length) { showReport(result); return; }
      if (current.dirty && !confirm('가져온 파일로 현재 편집 초안을 교체할까요? 아직 내보내지 않은 수정은 사라집니다.')) return;
      current.draft = copy(result.value);
      current.jsonDirty = false;
      current.eventIndex = 0;
      current.endingIndex = 0;
      current.randomIndex = 0;
      mark(); render();
      showReport(result, '파일을 편집 초안으로 가져왔습니다. 게임에 넣으려면 “적용하고 새 게임”을 누르세요.');
    });
    reader.addEventListener('error', () => {
      if (current === owner) showReport({ errors: ['파일을 읽지 못했습니다. 다시 선택해 주세요.'], warnings: [] });
    });
    reader.readAsText(file, 'UTF-8');
  }

  function check() {
    if (current.jsonDirty) {
      const parsed = parseJSON(current.jsonBuffer);
      if (parsed.errors.length) { showReport(parsed); return; }
      showReport(playReport(parsed.value), '플레이 검사를 통과했습니다. JSON 내용은 아직 편집 초안에 반영하지 않았습니다.');
      return;
    }
    showReport(playReport(current.draft), '플레이 검사를 통과했습니다. “적용하고 새 게임”으로 실행할 수 있습니다.');
  }

  function apply() {
    if (current.jsonDirty && !acceptJSON(false)) return;
    const result = playReport(current.draft);
    if (result.errors.length) { showReport(result); return; }
    const owner = current;
    try {
      const playable = copy(owner.draft);
      delete playable.draft;
      owner.onApply(playable);
      owner.dirty = false;
      close(true);
    } catch (error) {
      showReport({ errors: ['시나리오 적용 중 오류가 발생했습니다: ' + error.message], warnings: [] });
    }
  }

  function saveDraft() {
    if (current.jsonDirty && !acceptJSON(false)) return;
    const saved = copy(current.draft);
    saved.draft = true;
    const result = validation(saved);
    if (result.errors.length) { showReport(result); return; }
    const owner = current;
    try {
      owner.onApply(saved);
      owner.dirty = false;
      close(true);
    } catch (error) {
      showReport({ errors: ['초안 저장 중 오류가 발생했습니다: ' + error.message], warnings: [] });
    }
  }

  function clearAll() {
    if (!confirm('사건·선택지·연결·돌발 사건 규칙·수치·선택 기록·엔딩을 전부 삭제하고 빈 초안으로 시작할까요? 삭제 직전 내용은 이 페이지를 새로고침하기 전까지 한 번 되돌릴 수 있습니다.')) return;
    resetUndo = { draft: copy(current.draft), eventIndex: current.eventIndex, endingIndex: current.endingIndex,
      randomIndex: current.randomIndex, jsonBuffer: current.jsonBuffer, jsonDirty: current.jsonDirty, page: current.page };
    current.draft = GameEngine.createBlankScenario();
    current.eventIndex = 0;
    current.endingIndex = 0;
    current.randomIndex = 0;
    current.jsonBuffer = '';
    current.jsonDirty = false;
    current.page = 'flowchart';
    mark(); render();
    showReport({ errors: [], warnings: [] }, '모든 내용을 비운 초안입니다. 흐름도에서 첫 사건을 추가하거나 수치·엔딩을 작성하세요. “초안 저장”을 누르면 빈 상태도 보관됩니다.');
  }

  function undoClear() {
    if (!resetUndo) return;
    const hasNewContent = current.jsonDirty || JSON.stringify(current.draft) !== JSON.stringify(GameEngine.createBlankScenario());
    if (hasNewContent && !confirm('전체 삭제 직전의 내용으로 되돌릴까요? 삭제 후 새로 작성한 내용은 교체됩니다.')) return;
    current.draft = copy(resetUndo.draft);
    current.eventIndex = resetUndo.eventIndex;
    current.endingIndex = resetUndo.endingIndex;
    current.randomIndex = resetUndo.randomIndex;
    current.jsonBuffer = resetUndo.jsonBuffer;
    current.jsonDirty = resetUndo.jsonDirty;
    current.page = resetUndo.page;
    resetUndo = null;
    mark(); render();
    showReport({ errors: [], warnings: [] }, '전체 삭제 직전의 편집 내용을 복원했습니다.');
  }

  function navigate(page) {
    if (current.page === 'json' && current.jsonDirty && page !== 'json') {
      if (!acceptJSON(false)) return;
    }
    current.page = page;
    render();
  }

  function render() {
    if (!current) return;
    if (current.flowchartCleanup) { current.flowchartCleanup(); current.flowchartCleanup = null; }
    current.dialog.classList.toggle('flowchart-mode', current.page === 'flowchart');
    const root = document.getElementById('editor-root');
    root.replaceChildren();
    const shell = $('div', 'editor-shell');
    const top = $('header', 'editor-top');
    const title = $('div');
    title.append($('h2', '', '시나리오 작업실'), $('p', 'small muted', '작성 중에는 초안 저장, 완성하면 적용하고 새 게임을 사용하세요. 수정한 파일은 JSON으로 따로 보관해 두세요.'));
    const tools = $('div', 'toolbar');
    const fileInput = $('input');
    fileInput.type = 'file'; fileInput.accept = '.json,application/json'; fileInput.hidden = true;
    fileInput.addEventListener('change', () => { importJSON(fileInput.files[0]); fileInput.value = ''; });
    tools.append(button('JSON 가져오기', () => fileInput.click()), button('JSON 내보내기', exportJSON), fileInput,
      button('전체 삭제', clearAll, 'danger'));
    if (resetUndo) tools.append(button('전체 삭제 되돌리기', undoClear));
    top.append(title, tools);
    const nav = $('nav', 'editor-nav');
    nav.setAttribute('aria-label', '시나리오 편집 탭');
    tabs.forEach(([id, label]) => {
      const tab = button(label, () => navigate(id), current.page === id ? 'secondary selected' : 'secondary');
      if (current.page === id) tab.setAttribute('aria-current', 'page');
      nav.append(tab);
    });
    const content = $('main', 'editor-content' + (current.page === 'flowchart' ? ' flowchart-content' : ''));
    if (current.page !== 'flowchart') {
      ({ overview: renderOverview, stats: renderStats, flags: renderFlags, events: renderEventList, randomEvents: renderRandomEvents, endings: renderEndings, json: renderJSON })[current.page](content);
    }
    const report = $('div', 'notice');
    report.id = 'editor-report'; report.hidden = true; report.setAttribute('role', 'status'); report.setAttribute('aria-live', 'polite');
    const footer = $('footer', 'editor-footer');
    footer.append(button('검사하기', check), button('초안 저장', saveDraft), button('적용하고 새 게임', apply, 'primary'), button('닫기', () => close(false)));
    shell.append(top, nav, content, report, footer);
    root.append(shell);
    if (current.page === 'flowchart') {
      current.flowchartCleanup = ScenarioFlowchart.mount(content, {
        scenario: current.draft,
        onChange: mark,
        onOpenRandomEvents: () => navigate('randomEvents'),
        onOpenEvent: eventId => {
          const index = current.draft.events.findIndex(event => event.id === eventId);
          if (index >= 0) { current.eventIndex = index; navigate('events'); }
        }
      });
    }
  }

  function close(force) {
    if (!current) return true;
    if (!force && current.dirty && !confirm('아직 게임에 적용하지 않은 편집 초안을 닫을까요? 보관하려면 취소하고 JSON으로 내보내세요.')) return false;
    const dialog = current.dialog;

  function normalize(scenario) {

    try{
      let doc;
      if(byId('scenario-data')||byId('bootstrap-script'))doc=document.cloneNode(true);
      else{
        const response=await fetch('standalone.html');if(!response.ok)throw Error('다운로드 파일을 읽을 수 없습니다.');
        doc=new DOMParser().parseFromString(await response.text(),'text/html');
      }
      const blank=E.createBlankScenario(),embedded=doc.getElementById('scenario-data'),bootstrap=doc.getElementById('bootstrap-script');
      if(embedded)embedded.textContent=JSON.stringify(blank).replace(/</g,'\\u003c');
      else if(bootstrap)bootstrap.textContent='globalThis.DEFAULT_SCENARIO = GameEngine.createBlankScenario();';
      else throw Error('프로그램 내려받기 파일의 구성을 확인할 수 없습니다.');
      // Export only the bundled application, excluding browser-injected assets.
      const bundledScripts=new Set(['ai-script','engine-script','scenario-data','scenario-loader','bootstrap-script','flowchart-script','editor-script','app-script']);
      doc.querySelectorAll('script').forEach(script=>{if(!bundledScripts.has(script.id))script.remove();});
      doc.querySelectorAll('link[rel="stylesheet"]').forEach(link=>link.remove());
      doc.querySelectorAll('style').forEach(style=>{if(!['game-styles','flowchart-styles','launcher-styles'].includes(style.id))style.remove();});
      doc.querySelectorAll('dialog[open]').forEach(d=>d.removeAttribute('open'));
      doc.getElementById('editor-dialog').removeAttribute('data-editor-bound');
      doc.getElementById('editor-dialog').classList.remove('flowchart-mode');
      for(const id of ['editor-root','info-content','scenario-open-content','story-panel','stats-panel','flags-panel','turn-label','scenario-title','scenario-subtitle','scenario-description','risk-summary','toast','status-message']){const node=doc.getElementById(id);if(node){node.innerHTML='';node.textContent='';}}
      for(const id of ['flags-count','ending-count']){const node=doc.getElementById(id);if(node)node.textContent=id==='flags-count'?'0':'0 / 0 →';}
      const saveStatus=doc.getElementById('save-status');if(saveStatus)saveStatus.textContent='';
      doc.querySelectorAll('input').forEach(input=>{input.removeAttribute('value');input.value='';});
      doc.body.classList.remove('empty-workspace');doc.title='역사의 갈림길 · 시나리오 플레이어';
      doc.getElementById('toast').hidden=true;doc.getElementById('status-message').hidden=true;
      download('history-crossroads-player.html','<!doctype html>\n'+doc.documentElement.outerHTML,'text/html');
      notify('시나리오가 포함되지 않은 프로그램을 내려받았습니다. 원고는 JSON으로 별도 보관하세요.');
    }catch(error){status(error.message,true);}
  }
  function help(){
    info('이야기를 불러오고 직접 쓰세요',`<p>시나리오의 사건을 읽고 선택지를 누르면 수치와 선택 기록이 바뀝니다. 조건과 확률에 따라 다음 사건과 결말이 달라집니다.</p><ol><li><strong>시나리오 열기:</strong> JSON 파일을 선택하거나 불러오기 화면에 끌어다 놓으세요.</li><li><strong>직접 쓰기:</strong> 흐름도에서 사건과 돌발 사건을 추가하고, 카드에서 본문·선택지·조건·수치 변화를 고칩니다. 작성 중에는 ‘초안 저장’, 플레이할 준비가 되면 ‘적용하고 새 게임’을 누르세요.</li><li><strong>AI로 만들기:</strong> ‘시나리오 열기’의 ‘AI로 만들기’ 탭에서 요청문을 복사해 ChatGPT·Claude 같은 AI에 보내고, 받은 답변을 붙여 넣으면 바로 플레이합니다. 문제가 있으면 AI에게 보낼 수정 요청 문구도 만들어 줍니다.</li><li data-community-only><strong>갤러리:</strong> 위쪽 ‘갤러리’에서 다른 사람의 시나리오를 플레이하고 좋아요를 누를 수 있습니다. 완성한 시나리오는 ‘갤러리에 올리기’로 공개할 수 있습니다(구글 로그인 필요).</li><li><strong>원고 보관:</strong> 시나리오 JSON을 내보내 보관하세요. ‘프로그램 내려받기’에는 원고가 포함되지 않습니다.</li><li><strong>진행 저장:</strong> 자동 저장으로 이어 하거나, ‘진행 저장’과 ‘불러오기’로 같은 내용의 시나리오에서 저장 지점으로 돌아갑니다.</li></ol><p class="notice">시나리오와 진행은 접속한 브라우저에 각각 저장되며 다른 접속자와 공유되지 않습니다. 브라우저 데이터를 지우기 전에는 원고를 JSON으로 내보내세요.</p><div class="toolbar"><button class="btn primary" id="download-html">프로그램 내려받기</button><button class="btn secondary" id="download-json">시나리오 JSON 내보내기</button><button class="btn secondary" id="new-scenario">빈 시나리오 새로 작성</button><button class="btn secondary" type="button" data-launch-action="open-ai">✦ AI로 시나리오 만들기</button><a class="btn secondary" href="gallery.html#upload" data-community-only>갤러리에 올리기</a></div>`);
    byId('download-html').onclick=exportHTML;
    byId('download-json').onclick=()=>download('scenario.json',JSON.stringify(scenario,null,2));
    byId('new-scenario').onclick=()=>{byId('info-dialog').close();newScenario();};
  }
  function applyScenario(next){
    return commitScenario(prepareScenario(next));
  }
  function commitScenario(prepared){
    scenario=prepared.scenario;state=prepared.state;
    awaitingName=Boolean(state&&playerSettings().askName!==false);nameReturnState=null;
    const saved=storage.set('scenario',scenario);saveSourceContext(saved);if(awaitingName)storage.set('autosave',null);else saveAuto();
    render();status(saved?(state?(awaitingName?'시나리오를 적용했습니다. 이름을 입력하고 시작하세요.':'시나리오를 적용했습니다. 새로운 역사를 시작하세요.'):'작성 중인 초안을 저장했습니다. 흐름도에서 이어서 작성하세요.'):'브라우저 저장이 불가능하므로 JSON으로 내보내 보관하세요.');
  }
  byId('story-panel').addEventListener('submit',event=>{
    if(event.target.id!=='player-name-form')return;
    event.preventDefault();startWithName(byId('player-name-input').value);
  });
  byId('story-panel').addEventListener('click',event=>{
    const choice=event.target.closest('[data-choice]');if(choice&&!choice.disabled){play(Number(choice.dataset.choice));return;}
    const action=event.target.closest('[data-action]')?.dataset.action;
    if(action==='restart')restart(false);if(action==='journal')journal();if(action==='collection')collection();
    if(action==='edit-flow')ScenarioEditor.open(scenario,applyScenario,{page:'flowchart'});
    if(action==='edit-scenario')ScenarioEditor.open(scenario,applyScenario);
    if(action==='default-name')startWithName(playerSettings().defaultName);
    if(action==='cancel-name'&&nameReturnState){state=nameReturnState;nameReturnState=null;awaitingName=false;render();status('이전 진행으로 돌아왔습니다.');}
  });
  byId('restart-button').onclick=()=>restart();byId('journal-button').onclick=journal;byId('collection-button').onclick=collection;byId('help-button').onclick=help;
  byId('edit-button').onclick=()=>ScenarioEditor.open(scenario,applyScenario);
  byId('flow-button').onclick=()=>ScenarioEditor.open(scenario,applyScenario,{page:'flowchart'});
  byId('open-scenario-button').onclick=openLauncher;
  byId('scenario-import').addEventListener('change',event=>{const file=event.target.files?.[0];event.target.value='';void importFile(file);});
  function chooseScenarioFile(){const input=byId('scenario-import');input.value='';input.click();}
  document.addEventListener('click',event=>{
    const action=event.target.closest('[data-launch-action]')?.dataset.launchAction;
    if(!action)return;
    try{
      if(action==='choose-file')chooseScenarioFile();
      if(action==='new')newScenario();
      if(action==='close')closeLauncher();
      if(action==='retry-url'&&failedScenarioUrl&&!launcherBusy)void loadScenarioUrl(failedScenarioUrl);
      if(action==='mode-file'||action==='mode-ai'){launcherMode=action==='mode-ai'?'ai':'file';refreshLaunchers(`[data-launch-action="${action}"]`);}
      if(action==='ai-copy-prompt')void copyAIPrompt();
      if(action==='ai-copy-repair')void copyRepair();
      if(action==='ai-import')importPasted();
      if(action==='ai-clear'){ai.paste='';ai.problem=null;ai.repair='';refreshLaunchers('[data-ai-field="paste"]');}
      if(action==='open-ai'){byId('info-dialog').close();launcherMode='ai';openLauncher();}
    }catch(error){setLauncherFeedback('',error.message);}
  });
  const aiFieldInput=event=>{
    const field=event.target.closest?.('[data-ai-field]');if(!field)return;
    const key=field.dataset.aiField;ai[key]=field.type==='checkbox'?field.checked:field.value;
    if(key==='paste')return;
    ai.prompt='';ai.promptNote='';ai.showPrompt=document.querySelector('.ai-prompt-view[open] [data-ai-prompt]')!==null;
    const preview=ScenarioAI.buildPrompt({idea:ai.idea,size:ai.size,endings:ai.endings});
    document.querySelectorAll('[data-ai-prompt]').forEach(node=>{node.value=preview;});
    document.querySelectorAll('.ai-maker .ai-note').forEach(node=>{if(!node.closest('.ai-problem'))node.hidden=true;});
  };
  document.addEventListener('input',aiFieldInput);document.addEventListener('change',aiFieldInput);
  document.addEventListener('keydown',event=>{
    if(event.target.matches?.('[data-ai-field="paste"]')&&event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();importPasted();}
  });
  document.addEventListener('keydown',event=>{
    const zone=event.target.closest('[data-scenario-dropzone]');
    if(zone&&(event.key==='Enter'||event.key===' ')){event.preventDefault();chooseScenarioFile();}
  });
  document.addEventListener('dragover',event=>{
    const zone=event.target.closest('[data-scenario-dropzone]');
    if(zone||Array.from(event.dataTransfer?.types||[]).includes('Files'))event.preventDefault();
    if(zone){zone.classList.add('drag-over');if(event.dataTransfer)event.dataTransfer.dropEffect='copy';}
  });
  document.addEventListener('dragleave',event=>event.target.closest('[data-scenario-dropzone]')?.classList.remove('drag-over'));
  document.addEventListener('drop',event=>{
    const zone=event.target.closest('[data-scenario-dropzone]');
    if(!zone&&!Array.from(event.dataTransfer?.types||[]).includes('Files'))return;
    event.preventDefault();document.querySelectorAll('.drag-over').forEach(node=>node.classList.remove('drag-over'));
    if(!zone){status('‘시나리오 열기’의 파일 영역에 JSON 파일을 놓아 주세요.');return;}
    const files=event.dataTransfer?.files;
    if(files?.length!==1){setLauncherFeedback('','JSON 파일을 한 번에 하나씩 놓아 주세요.');return;}
    void importFile(files[0]);
  });
  byId('save-button').onclick=()=>{if(!state||awaitingName)return;const ok=storage.set('save',envelope());render();notify(ok?'현재 진행을 저장했습니다.':'저장할 수 없습니다. 브라우저 저장 설정을 확인해 주세요.');};
  byId('load-button').onclick=()=>{
    const saved=storage.get('save');if(!saved||saved.signature!==signature()){notify('현재 시나리오와 호환되는 저장이 없습니다.');return;}
    if(!awaitingName&&state.turn&&!confirm('직접 저장한 지점으로 돌아갈까요?'))return;
    try{state=E.restoreState(scenario,saved.state);awaitingName=false;nameReturnState=null;saveAuto();rememberEnding();render();status('저장한 진행을 불러왔습니다.');}catch(error){status('저장 불러오기 실패: '+error.message,true);}
  };
  document.addEventListener('keydown',event=>{
    if(!state||awaitingName||event.altKey||event.ctrlKey||event.metaKey||document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;
    if(/^[1-9]$/.test(event.key)){const index=Number(event.key)-1,item=E.getChoices(scenario,state).find(c=>c.index===index);if(item?.enabled){event.preventDefault();play(index);}}
  });
  try{
    state=scenario.draft===true?null:E.createState(scenario,{playerName:scenario.player?.defaultName||'플레이어'});
    awaitingName=Boolean(state&&playerSettings().askName!==false);
    const auto=storage.get('autosave');if(state&&auto&&auto.signature===signature())try{state=E.restoreState(scenario,auto.state);awaitingName=false;}catch{status('이전 자동 저장을 읽지 못해 새 회차를 시작합니다.',true);}
    rememberEnding();render();
  }catch(error){status('시나리오를 시작할 수 없습니다: '+error.message,true);byId('scenario-title').textContent='시나리오를 확인해 주세요';}
  // Public handoff: raw manuscripts are JSON; the downloadable player stays blank.
  globalThis.HistoryCrossroads={getScenario:()=>E.clone(scenario),importScenario,importText,newScenario,ready:Promise.resolve(null)};
  const scenarioPath=new URL(location.href).searchParams.get('scenario');
  if(scenarioPath){
    const savedContext=storage.get('sourceContext');
    if(hasStoredScenario&&savedContext?.context===sourceContext()&&savedContext.signature===signature()){
      status(state?'이 주소에서 저장한 시나리오와 진행을 이어갑니다.':'이 주소에서 저장한 편집 초안을 이어갑니다.');
      globalThis.HistoryCrossroads.ready=Promise.resolve(E.clone(scenario));
    }else globalThis.HistoryCrossroads.ready=loadScenarioUrl(scenarioPath);
  }
})();

</script>
</body>
</html>
