<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>역사의 갈림길 · 역사 지도 5종</title><link rel="stylesheet" href="map-view.css"><style>body{margin:0;background:#eeeee5;color:#263f35;font:16px/1.65 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px}h1{margin:4px 0;font-family:serif;font-size:36px}.intro{max-width:960px;color:#586951}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button,select,a.btn{font:inherit;padding:10px 15px;border:1px solid #cbd0c2;border-radius:8px;color:#234c3f;background:#fffef9;cursor:pointer;text-decoration:none}button[aria-pressed=true]{color:#fff;background:#234d40}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0}.history-map{background:#fffef9;border-radius:16px;overflow:hidden;border:1px solid #d8dccf}.map-viewport{height:min(67vh,740px)}.map-legend{max-height:130px;overflow:auto}.notice{background:#fffdf6;padding:16px;border-radius:12px}.status{min-height:24px}a{color:#234e49}</style></head><body><main><a href="index.html">← 역사의 갈림길</a><h1>역사 속의 다섯 갈림길</h1><p class="intro">기존 균형 구획에 시대별 국가와 영토를 배치한 편집용 기본안입니다. 지도를 고르고 국가를 선택해 둘러보세요. 휠로 확대·축소하고 드래그로 이동할 수 있습니다.</p><nav class="toolbar" id="maps" aria-label="역사 지도 선택"></nav><p id="status" class="status" role="status"></p><div class="actions"><label>플레이어 국가 <select id="country"></select></label><button id="edit">지도 작업실에서 열기</button><a id="download" class="btn" download>갤러리용 지도 JSON 받기</a></div><div id="map"></div><p class="notice" id="notice"></p><p><a href="HISTORICAL-MAP-SOURCES.md">제작 기준·보정 자료·이용조건</a> · 지도 구획은 현대 행정구역 기반이며, 작은 제후국·도시국가·정확한 전선은 근사 처리됩니다. 특히1550년의 여러 공동체는 실재 단일 국가를 뜻하지 않습니다.</p></main><script src="map-templates.js"></script><script src="map-view.js"></script><script src="engine.js"></script><script src="map-document.js"></script><script>const catalog=[{"id":"historical_europe_1444","title":"유럽 15세기 · 1444년","year":1444,"date":"1444년 무렵","baseId":"europe-balanced","regions":2431,"countries":109,"ownedUnits":106,"bytes":232324,"filename":"historical_europe_1444.map.json"},{"id":"historical_europe_1648","title":"유럽 17세기 · 1648년","year":1648,"date":"1648년 베스트팔렌 조약 이후","baseId":"europe-balanced","regions":2431,"countries":75,"ownedUnits":75,"bytes":194595,"filename":"historical_europe_1648.map.json"},{"id":"historical_world_1550","title":"세계 16세기 · 1550년","year":1550,"date":"1550년 무렵","baseId":"world-balanced","regions":5939,"countries":176,"ownedUnits":174,"bytes":483561,"filename":"historical_world_1550.map.json"},{"id":"historical_world_1914","title":"제1차 세계대전 전야 · 1914년","year":1914,"date":"1914년 7월, 유럽 전쟁 발발 직전","baseId":"world-balanced","regions":5939,"countries":139,"ownedUnits":137,"bytes":559473,"filename":"historical_world_1914.map.json"},{"id":"historical_world_1939","title":"제2차 세계대전 전야 · 1939년","year":1939,"date":"1939년 8월, 폴란드 침공 직전·중일전쟁 진행 중","baseId":"world-balanced","regions":5939,"countries":153,"ownedUnits":149,"bytes":573881,"filename":"historical_world_1939.map.json"}];let current,scenario,token=0;const status=document.getElementById('status'),country=document.getElementById('country');async function show(entry){const request=++token;status.textContent='선택한 지도를 불러오고 있습니다.';try{const response=await fetch('examples/maps/'+entry.filename);if(!response.ok)throw Error('지도 파일을 불러오지 못했습니다.');const candidate=await response.json();await MapTemplates.ensure(candidate.map.templateId);const valid=MapDocument.normalize(candidate);if(request!==token)return;current=valid;scenario=MapDocument.toScenario(valid);country.replaceChildren();for(const c of valid.map.countries){const option=document.createElement('option');option.value=c.id;option.textContent=c.name;country.append(option);}country.value=valid.map.playerCountry;document.querySelectorAll('[data-map-id]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mapId===entry.id)));document.getElementById('download').href='examples/maps/'+entry.filename;document.getElementById('notice').textContent=entry.date+' · '+entry.regions.toLocaleString()+'개 지역 · 소유 영토가 있는 '+entry.ownedUnits+'개 편집 단위. '+valid.description;MapView.render(document.getElementById('map'),scenario);status.textContent=entry.title;}catch(error){if(request===token)status.textContent=error.message;}}for(const item of catalog){const b=document.createElement('button');b.type='button';b.dataset.mapId=item.id;b.textContent=item.title;b.addEventListener('click',()=>show(item));document.getElementById('maps').append(b);}country.addEventListener('change',()=>{if(scenario){scenario.map.playerCountry=country.value;current.map.playerCountry=country.value;MapView.render(document.getElementById('map'),scenario);}});document.getElementById('edit').addEventListener('click',()=>{if(current){sessionStorage.setItem('hc:pendingMapImport',JSON.stringify({data:current}));location.href='index.html?mapMaker=1';}});show(catalog[0]);</script></body></html>
